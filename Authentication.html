<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YUUSHI Administration Portal</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #f5e8d3;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        width: 100%;
        max-width: 420px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }

      .header {
        text-align: center;
        padding: 30px 20px 20px;
      }

      .logo {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-bottom: 8px;
      }

      .logo img {
        height: 32px;
      }

      .title {
        font-size: 18px;
        color: #d4a017;
        font-weight: 600;
      }

      .form-container {
        padding: 0 30px 30px;
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-size: 14px;
        color: #333;
      }

      input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 15px;
        margin-bottom: 18px;
        background: #f8f8f8;
      }

      input:focus {
        outline: none;
        border-color: #d4a017;
        box-shadow: 0 0 0 3px rgba(212, 160, 23, 0.1);
      }

      .password-wrapper {
        position: relative;
      }

      .toggle-password {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        color: #666;
        font-size: 18px;
      
        border: 0;
        background: transparent;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .toggle-password svg { width: 20px; height: 20px; display: block; }

      .forgot-link {
        text-align: right;
        margin-top: -12px;
        margin-bottom: 20px;
      }

      .forgot-link a {
        color: #d4a017;
        text-decoration: none;
        font-size: 14px;
      }

      .btn {
        width: 100%;
        padding: 14px;
        background: #d4a017;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        margin-bottom: 15px;
      }

      .btn:hover {
        background: #c08f0f;
      }

      .back-link {
        text-align: center;
        margin-top: 10px;
      }

      .back-link a {
        color: #666;
        text-decoration: none;
        font-size: 14px;
      }

      .otp-container {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin: 25px 0;
      }

      .otp-box {
        width: 48px;
        height: 52px;
        text-align: center;
        font-size: 24px;
        border: 1px solid #ddd;
        border-radius: 6px;
        background: #f8f8f8;
      }

      .sub-header {
        text-align: center;
        margin-bottom: 16px;
        color: #d4a017;
        font-weight: 600;
      }
    .pw-toggle svg { width: 18px; height: 18px; display: block; }
    </style>
  </head>
  <body>
    <!-- Screen 1: Login -->
    <div class="container" id="screen1">
      <div class="header">
        <div class="logo">
          <span style="font-size: 28px">♾️</span>
          <span class="title">YUUSHI</span>
        </div>
        <h2 style="color: #333; font-size: 18px; margin-top: 10px">
          Welcome to Administration Portal
        </h2>
      </div>
      <div class="form-container">
        <label>Username</label>
        <input type="text" placeholder="Enter username" id="username" />

        <label>Password</label>
        <div class="password-wrapper">
          <input type="password" placeholder="Enter password" id="password" />
          <button type="button" class="toggle-password" aria-label="Show password" title="Show password" onclick="togglePassword(this)"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
        </div>

        <div class="forgot-link">
          <a href="#" onclick="showScreen(2)">Forgot password</a>
        </div>

        <button class="btn" onclick="showScreen(6)">SEND</button>
      </div>
    </div>

    <!-- Screen 6: Two-Factor Authentication (2FA) after login -->
    <div class="container" id="screen6" style="display: none">
      <div class="header">
        <h2 class="sub-header">Two-Factor Authentication</h2>
      </div>
      <div class="form-container">
        <div class="otp-container">
          <input
            type="text"
            class="otp-box"
            maxlength="1"
            oninput="moveToNext(this, 1)"
          />
          <input
            type="text"
            class="otp-box"
            maxlength="1"
            oninput="moveToNext(this, 2)"
          />
          <input
            type="text"
            class="otp-box"
            maxlength="1"
            oninput="moveToNext(this, 3)"
          />
          <input
            type="text"
            class="otp-box"
            maxlength="1"
            oninput="moveToNext(this, 4)"
          />
          <input
            type="text"
            class="otp-box"
            maxlength="1"
            oninput="moveToNext(this, 5)"
          />
        </div>

        <button
          class="btn"
          onclick="alert('Login successful with Two-Factor Authentication!')"
        >
          CONFIRM
        </button>
        <div class="back-link">
          <a href="#" onclick="showScreen(1)">← Back to Login</a>
        </div>
      </div>
    </div>

    <!-- Screen 2: Forgot Password -->
    <div class="container" id="screen2" style="display: none">
      <div class="header">
        <h2 class="sub-header">Forgot Password</h2>
      </div>
      <div class="form-container">
        <label>Email</label>
        <input type="email" placeholder="Enter email" id="forgot-email" />

        <button class="btn" onclick="showScreen(3)">SEND</button>
        <div class="back-link">
          <a href="#" onclick="showScreen(1)">← Back to Login</a>
        </div>
      </div>
    </div>

    <!-- Screen 3: OTP Verification -->
    <div class="container" id="screen3" style="display: none">
      <div class="header">
        <h2 class="sub-header">OTP Verification</h2>
      </div>
      <div class="form-container">
        <label>Email</label>
        <input
          type="email"
          placeholder="Enter email"
          value="example@email.com"
          readonly
        />

        <button class="btn" onclick="showScreen(4)">SEND</button>
        <div class="back-link">
          <a href="#" onclick="showScreen(2)">← Back to Login</a>
        </div>
      </div>
    </div>

    <!-- Screen 4: Verification Code -->
    <div class="container" id="screen4" style="display: none">
      <div class="header">
        <h2 class="sub-header">Verification Code</h2>
      </div>
      <div class="form-container">
        <div class="otp-container">
          <input
            type="text"
            class="otp-box"
            maxlength="1"
            oninput="moveToNext(this, 1)"
          />
          <input
            type="text"
            class="otp-box"
            maxlength="1"
            oninput="moveToNext(this, 2)"
          />
          <input
            type="text"
            class="otp-box"
            maxlength="1"
            oninput="moveToNext(this, 3)"
          />
          <input
            type="text"
            class="otp-box"
            maxlength="1"
            oninput="moveToNext(this, 4)"
          />
          <input
            type="text"
            class="otp-box"
            maxlength="1"
            oninput="moveToNext(this, 5)"
          />
        </div>

        <button class="btn" onclick="showScreen(5)">CONFIRM</button>
        <div class="back-link">
          <a href="#" onclick="showScreen(1)">← Back to Login</a>
        </div>
      </div>
    </div>

    <!-- Screen 5: Confirm Password -->
    <div class="container" id="screen5" style="display: none">
      <div class="header">
        <h2 class="sub-header">Confirm Password</h2>
      </div>
      <div class="form-container">
        <label>Password</label>
        <div class="password-wrapper">
          <input type="password" placeholder="Enter password" id="new-pass" />
          <button type="button" class="toggle-password" aria-label="Show password" title="Show password" onclick="togglePassword(this)"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
        </div>

        <label>Confirm Password</label>
        <div class="password-wrapper">
          <input
            type="password"
            placeholder="Re-enter password"
            id="confirm-pass"
          />
          <button type="button" class="toggle-password" aria-label="Show password" title="Show password" onclick="togglePassword(this)"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
        </div>

        <button
          class="btn"
          onclick="alert('Password has been changed successfully!')"
        >
          CONFIRM
        </button>
        <div class="back-link">
          <a href="#" onclick="showScreen(1)">← Back to Login</a>
        </div>
      </div>
    </div>

    <script>
      function showScreen(screenNumber) {
        for (let i = 1; i <= 6; i++) {
          const screen = document.getElementById(`screen${i}`);
          if (screen)
            screen.style.display = i === screenNumber ? "block" : "none";
        }
      }

      function togglePassword(icon) {
        const input = icon.previousElementSibling;
        input.type = input.type === "password" ? "text" : "password";
        const visible = input.type === "text";
        icon.innerHTML = visible ? "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M3 3l18 18M10.6 10.6a2 2 0 002.8 2.8M9.9 5.2A10.9 10.9 0 0112 5c6.4 0 10 7 10 7a17 17 0 01-4 4.6M6.2 6.2C3.5 8.1 2 12 2 12s3.6 7 10 7c1.2 0 2.3-.2 3.3-.6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>" : "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"/><circle cx=\"12\" cy=\"12\" r=\"3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"/></svg>";
        icon.setAttribute("aria-label", visible ? "Hide password" : "Show password");
        icon.title = visible ? "Hide password" : "Show password";
      }

      function moveToNext(current, index) {
        if (current.value.length === 1) {
          const nextInput = current.parentElement.querySelector(
            `input:nth-child(${index + 1})`,
          );
          if (nextInput) nextInput.focus();
        }
      }
    </script>
  </body>
</html>
