<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Messages — YUUSHI Support Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --bg: #f5f0e8;
        --accent: #c4714a;
        --accent-dark: #a55232;
        --gold: #c4a25f;
        --chat-bg: #f0ede8;
        --bubble-me: #8b7355;
        --bubble-them: #ffffff;
        --text: #333333;
        --text-sec: #999999;
        --border: #e9e2d6;
        --online: #2ecc71;
        --unread: #c4714a;
      }
      html, body { height: 100%; }
      body {
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        overflow: hidden;
        display: flex;
      }

      /* ===== SIDEBAR (Conversation List) ===== */
      .sidebar {
        width: 280px;
        min-width: 280px;
        background: #fff;
        height: 100vh;
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--border);
      }
      .sb-top { padding: 16px 18px 10px; }
      .sb-logo {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 14px;
      }
      .sb-logo .mark {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: linear-gradient(135deg, #c4714a, #a55232);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        font-weight: 800;
      }
      .sb-logo .txt {
        font-size: 17px;
        font-weight: 800;
        letter-spacing: 0.03em;
        color: #1a1a1a;
      }
      .sb-search {
        position: relative;
        margin-bottom: 12px;
      }
      .sb-search i {
        position: absolute;
        left: 13px;
        top: 50%;
        transform: translateY(-50%);
        color: #b7afa2;
        font-size: 13px;
      }
      .sb-search input {
        width: 100%;
        padding: 10px 14px 10px 34px;
        background: #f3efe8;
        border: 1px solid #ece5da;
        border-radius: 22px;
        font-size: 13px;
        outline: none;
        color: var(--text);
      }
      .sb-search input:focus { border-color: var(--gold); }
      .convo-list { flex: 1; overflow-y: auto; }
      .convo {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 11px 18px;
        cursor: pointer;
        border-left: 3px solid transparent;
        transition: background 0.15s;
      }
      .convo:hover { background: #f6f1e8; }
      .convo.active {
        background: #f1e9da;
        border-left-color: var(--gold);
      }
      .av {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        flex-shrink: 0;
        background: #e7e2d8;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        font-weight: 700;
        color: #6b6256;
        position: relative;
      }
      .av .dot {
        position: absolute;
        bottom: 1px;
        right: 1px;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: var(--online);
        border: 2px solid #fff;
      }
      .convo-mid { flex: 1; min-width: 0; }
      .convo-name {
        font-size: 14px;
        font-weight: 600;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .convo.unread .convo-name {
        color: var(--accent);
        font-weight: 700;
      }
      .convo-prev {
        font-size: 12.5px;
        color: var(--text-sec);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-top: 2px;
      }
      .convo-right {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
        flex-shrink: 0;
      }
      .convo-time {
        font-size: 11px;
        color: var(--text-sec);
        white-space: nowrap;
      }
      .badge {
        min-width: 19px;
        height: 19px;
        padding: 0 5px;
        border-radius: 10px;
        background: var(--unread);
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ===== CHAT AREA ===== */
      .chat {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: var(--chat-bg);
        min-width: 0;
      }
      .chat-top {
        background: #fff;
        border-bottom: 1px solid var(--border);
        padding: 14px 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 62px;
      }
      .ct-name {
        font-size: 16px;
        font-weight: 700;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .ct-name .gdot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--online);
      }
      .ct-sub {
        font-size: 12px;
        margin-top: 2px;
        color: var(--text-sec);
      }
      .ct-sub .st-online { color: var(--online); font-weight: 600; }
      .ct-sub .st-offline { color: var(--text-sec); font-weight: 600; }

      /* ===== MESSAGES ===== */
      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 22px 26px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .day-sep {
        text-align: center;
        font-size: 11px;
        color: var(--text-sec);
        margin: 10px 0;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        font-weight: 600;
      }
      .msg { display: flex; align-items: flex-end; gap: 10px; margin-bottom: 4px; }
      .msg.mine { justify-content: flex-end; }
      .msg.mine .bubble { background: var(--bubble-me); color: #fff; }
      .msg.theirs .bubble { background: var(--bubble-them); color: var(--text); border: 1px solid var(--border); }
      .bubble {
        max-width: 60%;
        padding: 9px 14px;
        border-radius: 14px;
        font-size: 13px;
        line-height: 1.5;
        word-break: break-word;
      }
      .msg-time {
        font-size: 11px;
        color: var(--text-sec);
        white-space: nowrap;
        padding: 0 4px;
      }
      .empty-chat {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 10px;
        color: var(--text-sec);
      }
      .empty-chat i { font-size: 48px; opacity: 0.3; }
      .empty-chat-text { font-size: 13px; text-align: center; }

      /* ===== INPUT AREA ===== */
      .chat-input-area {
        background: #fff;
        border-top: 1px solid var(--border);
        padding: 16px 20px;
        display: flex;
        align-items: flex-end;
        gap: 10px;
      }
      .input-wrap {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .input-wrap textarea {
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 10px 16px;
        font-size: 13px;
        font-family: inherit;
        resize: vertical;
        min-height: 38px;
        max-height: 100px;
        outline: none;
        color: var(--text);
      }
      .input-wrap textarea:focus { border-color: var(--accent); }
      .send-btn {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: #fff;
        cursor: pointer;
        font-size: 15px;
        color: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.15s;
      }
      .send-btn:hover { background: var(--accent-dark); color: #fff; }

      /* ===== No selection state ===== */
      .chat.empty { display: none; }
      .no-convo {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: var(--text-sec);
        font-size: 13px;
      }
    </style>
  </head>
  <body>

    <!-- ===== SIDEBAR (Conversations) ===== -->
    <div class="sidebar">
      <div class="sb-top">
        <div class="sb-logo">
          <div class="mark">Y</div>
          <div class="txt">YUUSHI</div>
        </div>
        <div class="sb-search">
          <i class="fas fa-search"></i>
          <input type="text" placeholder="Search conversations..." id="searchConvo" />
        </div>
      </div>
      <div class="convo-list" id="convoList">
        <!-- Dynamically populated -->
      </div>
    </div>

    <!-- ===== CHAT AREA ===== -->
    <div class="chat" id="chatPanel">
      <div class="chat-top">
        <div>
          <div class="ct-name">
            <div id="chatName">—</div>
            <div class="gdot" id="chatOnline" style="display: none;"></div>
          </div>
          <div class="ct-sub" id="chatStatus">Select a conversation to start</div>
        </div>
      </div>

      <div class="messages" id="messagesArea">
        <!-- Messages dynamically inserted here -->
      </div>

      <div class="chat-input-area">
        <div class="input-wrap">
          <textarea id="messageInput" placeholder="Type your message..." rows="1"></textarea>
        </div>
        <button class="send-btn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
      </div>
    </div>

    <div class="no-convo" id="noChatPanel">
      <div style="text-align: center;">
        <i class="fas fa-comments" style="font-size: 48px; opacity: 0.3; display: block; margin-bottom: 10px;"></i>
        <div>Select a conversation to start messaging</div>
      </div>
    </div>

    <script>
      // Sample conversations (with Clients and Admins only)
      const conversations = [
        {
          id: 1,
          name: "Tanaka Hiroshi",
          type: "client",
          online: true,
          unread: 2,
          lastMessage: "Thanks for the quick response!",
          lastTime: "2 min ago",
          messages: [
            { from: "them", text: "Hi, I have a question about the service.", time: "10:30 AM" },
            { from: "me", text: "Sure, happy to help! What's your question?", time: "10:32 AM" },
            { from: "them", text: "Is there a discount for annual contracts?", time: "10:35 AM" },
            { from: "them", text: "Thanks for the quick response!", time: "10:38 AM" }
          ]
        },
        {
          id: 2,
          name: "Platform Admin",
          type: "admin",
          online: true,
          unread: 0,
          lastMessage: "New service request assigned to your account",
          lastTime: "1 hour ago",
          messages: [
            { from: "them", text: "New service request assigned to your account", time: "9:45 AM" }
          ]
        },
        {
          id: 3,
          name: "Suzuki Yuki",
          type: "client",
          online: false,
          unread: 0,
          lastMessage: "Thanks, that helps!",
          lastTime: "Yesterday",
          messages: [
            { from: "them", text: "Hi, do you offer consultation services?", time: "Yesterday 3:22 PM" },
            { from: "me", text: "Yes, we do. Would you like to schedule a call?", time: "Yesterday 3:25 PM" },
            { from: "them", text: "Thanks, that helps!", time: "Yesterday 3:28 PM" }
          ]
        }
      ];

      let currentConvoId = null;

      const $ = (id) => document.getElementById(id);

      function renderConversations() {
        const list = $("convoList");
        list.innerHTML = conversations.map(c => `
          <div class="convo ${c.id === currentConvoId ? 'active' : ''} ${c.unread > 0 ? 'unread' : ''}" onclick="selectConversation(${c.id})">
            <div class="av">
              ${c.name.split(' ').map(w => w[0]).join('').toUpperCase()}
              ${c.online ? '<div class="dot"></div>' : ''}
            </div>
            <div class="convo-mid">
              <div class="convo-name">${c.name}</div>
              <div class="convo-prev">${c.lastMessage}</div>
            </div>
            <div class="convo-right">
              <div class="convo-time">${c.lastTime}</div>
              ${c.unread > 0 ? `<div class="badge">${c.unread}</div>` : ''}
            </div>
          </div>
        `).join("");
      }

      function selectConversation(id) {
        currentConvoId = id;
        const convo = conversations.find(c => c.id === id);
        if (!convo) return;

        $("chatName").textContent = convo.name;
        $("chatOnline").style.display = convo.online ? 'block' : 'none';
        $("chatStatus").innerHTML = convo.online 
          ? '<span class="st-online">● Online</span>' 
          : '<span class="st-offline">Offline</span>';

        renderMessages();
        renderConversations();
        convo.unread = 0;
        $("messageInput").focus();
      }

      function renderMessages() {
        const convo = conversations.find(c => c.id === currentConvoId);
        if (!convo) return;

        const area = $("messagesArea");
        area.innerHTML = convo.messages.map(msg => `
          <div class="msg ${msg.from === 'me' ? 'mine' : 'theirs'}">
            ${msg.from === 'theirs' ? '<div class="msg-time">' + msg.time + '</div>' : ''}
            <div class="bubble">${escapeHtml(msg.text)}</div>
            ${msg.from === 'me' ? '<div class="msg-time">' + msg.time + '</div>' : ''}
          </div>
        `).join("");

        // Scroll to bottom
        setTimeout(() => { area.scrollTop = area.scrollHeight; }, 50);
      }

      function sendMessage() {
        const text = $("messageInput").value.trim();
        if (!text || !currentConvoId) return;

        const convo = conversations.find(c => c.id === currentConvoId);
        if (!convo) return;

        const now = new Date();
        const time = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

        convo.messages.push({
          from: "me",
          text: text,
          time: time
        });
        convo.lastMessage = text;
        convo.lastTime = "now";

        $("messageInput").value = "";
        renderMessages();
        renderConversations();
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      $("messageInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      renderConversations();
    </script>
  </body>
</html>
