<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Groups — YUUSHI Support Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
      :root {
        --accent: #c4714a; --accent-dark: #a55232; --accent-soft: #fdeee4; --accent-tint: #faf0e9;
        --bg-body: #f5f0e8; --bg-card: #fff; --bg-alt: #fdfcf9;
        --border: #e9e2d6; --border-soft: #f0ece4;
        --text-main: #333; --text-head: #222; --text-muted: #8a8178; --text-dim: #aaa094;
        --pink: #e74c7a; --grey-pill: #eceae4; --grey-pill-dark: #ddd8cf;
        --green: #2f855a; --red: #c0392b;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body { font-family: Arial, Helvetica, system-ui, sans-serif; background: var(--bg-body); color: var(--text-main); font-size: 13px; line-height: 1.5; display: flex; -webkit-font-smoothing: antialiased; }
      a { color: var(--accent); text-decoration: none; cursor: pointer; }

      /* ===== Main ===== */
      .main { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
      .content { flex: 1; overflow-y: auto; padding: 24px; }

      /* ===== Buttons ===== */
      .btn { border-radius: 6px; border: 1px solid var(--border); padding: 8px 16px; font-size: 13px; background: #fff; cursor: pointer; display: inline-flex; gap: 7px; align-items: center; justify-content: center; color: var(--text-main); font-family: inherit; font-weight: 600; }
      .btn:hover { background: var(--bg-alt); }
      .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      .btn-primary:hover { background: var(--accent-dark); }
      .btn-ghost { background: transparent; }
      .btn-danger { color: var(--red); border-color: #f0d3cc; }
      .btn-danger:hover { background: #fdf1ee; }
      .btn-pill { border-radius: 20px; }
      .btn-sm { padding: 6px 12px; font-size: 12px; }

      /* ===== Page header ===== */
      .page-title { font-size: 24px; font-weight: 800; color: var(--text-head); }
      .page-subtitle { font-size: 12.5px; color: var(--accent); font-style: italic; margin-top: 2px; }
      .list-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; flex-wrap: wrap; gap: 12px; }
      .head-right { display: flex; align-items: center; gap: 10px; }

      /* ===== Card ===== */
      .card { background: #fff; border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 1px 3px rgba(60,41,28,0.04); overflow: hidden; }

      /* ===== Table ===== */
      table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
      .data thead { background: #f6f3ec; }
      .data th { padding: 12px 14px; text-align: left; font-size: 12px; font-weight: 700; color: #555; white-space: nowrap; }
      .data td { padding: 11px 14px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
      .data tbody tr:nth-child(even) { background: var(--bg-alt); }
      .data tbody tr:hover { background: var(--accent-tint); }
      .name-cell { display: flex; align-items: center; gap: 10px; cursor: pointer; }
      .ini-avatar { width: 30px; height: 30px; border-radius: 50%; background: #e7e2d8; color: #6b6256; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
      .act-icons { display: flex; gap: 10px; color: #b3a89c; }
      .act-icons i { cursor: pointer; }
      .act-icons i:hover { color: var(--accent); }
      .checkbox { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }

      /* ===== Color dot ===== */
      .color-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }

      /* ===== Detail screen ===== */
      .dt-bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
      .back-arrow { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); background: #fff; cursor: pointer; color: var(--text-main); font-size: 15px; flex-shrink: 0; }
      .back-arrow:hover { background: var(--bg-alt); }
      .dt-name { font-size: 22px; font-weight: 800; color: var(--text-head); line-height: 1.1; }
      .sec { padding: 18px 22px; border-bottom: 1px solid var(--border-soft); }
      .sec:first-child { padding-top: 20px; }
      .sec:last-child { border-bottom: 0; }
      .sec-head { display: flex; align-items: center; justify-content: space-between; }
      .sec-title { font-size: 15px; font-weight: 700; color: var(--text-head); }
      .sec-sub { font-size: 12px; color: var(--accent); font-style: italic; margin: 2px 0 14px; }

      /* ===== Empty state ===== */
      .empty-state { min-height: 160px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; text-align: center; }
      .empty-state .et { font-size: 14px; font-weight: 700; color: var(--text-head); }
      .empty-state .es { font-size: 12.5px; color: var(--text-muted); max-width: 320px; }

      /* ===== Color swatches ===== */
      .swatch-row { display: flex; gap: 8px; flex-wrap: wrap; }
      .swatch { width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
      .swatch.active { border-color: var(--text-head); }

      /* ===== Modal ===== */
      .modal-overlay { position: fixed; inset: 0; background: rgba(59,47,42,0.35); display: none; align-items: center; justify-content: center; z-index: 200; }
      .modal-overlay.open { display: flex; }
      .modal-box { background: #fff; border-radius: 12px; width: 440px; max-width: 92vw; padding: 22px; box-shadow: 0 20px 50px rgba(0,0,0,0.25); max-height: 86vh; overflow-y: auto; }
      .modal-box h3 { font-size: 17px; font-weight: 800; color: var(--text-head); margin-bottom: 4px; }
      .modal-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }
      .fld { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
      .fld label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; }
      .fld input, .fld textarea { border: 1px solid var(--border); border-radius: 6px; padding: 9px 12px; font-size: 13px; font-family: inherit; background: #fff; outline: none; width: 100%; }
      .fld input:focus, .fld textarea:focus { border-color: var(--accent); }
      .fld textarea { min-height: 60px; resize: vertical; }
      .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

      /* ===== Toast ===== */
      .toast-wrap { position: fixed; bottom: 20px; right: 20px; z-index: 999; display: flex; flex-direction: column; gap: 8px; }
      .toast { background: var(--accent); color: #fff; padding: 11px 16px; border-radius: 8px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
      .toast.success { background: var(--green); }
      .toast.error { background: var(--red); }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <main class="main">
      <div class="content">

        <!-- ===== SCREEN 1: GROUPS LIST ===== -->
        <div id="screenGroupsList">
          <div class="list-head">
            <div>
              <div class="page-title">Customer Groups</div>
              <div class="page-subtitle">Create and manage customer tags and classifications</div>
            </div>
            <div class="head-right">
              <button class="btn btn-primary btn-pill" onclick="openCreateGroupModal()"><i class="fas fa-plus"></i> Create Group</button>
            </div>
          </div>

          <div class="card">
            <table class="data">
              <thead>
                <tr>
                  <th><input type="checkbox" class="checkbox" /></th>
                  <th>Group Name</th>
                  <th>Color</th>
                  <th>Members</th>
                  <th>Created</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="groupsList">
                <!-- Dynamically populated -->
              </tbody>
            </table>
          </div>
        </div>

        <!-- ===== SCREEN 2: GROUP DETAIL ===== -->
        <div id="screenGroupDetail" class="hidden">
          <div class="dt-bar">
            <button class="back-arrow" onclick="backToList()"><i class="fas fa-arrow-left"></i></button>
            <div style="display: flex; align-items: center; gap: 12px;">
              <div class="color-dot" id="detailColorDot" style="width: 24px; height: 24px;"></div>
              <div class="dt-name" id="detailName">—</div>
            </div>
          </div>

          <div class="card" style="margin-top: 16px;">
            <div class="sec">
              <div class="sec-head">
                <div>
                  <div class="sec-title">Group Information</div>
                </div>
                <button class="btn btn-sm" onclick="openEditGroupModal()"><i class="fas fa-pencil"></i> Edit</button>
              </div>
              <div style="margin-top: 12px;">
                <div style="margin-bottom: 8px; font-size: 13px;"><strong>Description:</strong> <span id="detailDesc">—</span></div>
                <div style="margin-bottom: 8px; font-size: 13px;"><strong>Members:</strong> <span id="detailMemberCount">0</span></div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </main>

    <!-- ===== CREATE/EDIT GROUP MODAL ===== -->
    <div class="modal-overlay" id="groupModal">
      <div class="modal-box">
        <h3 id="groupModalTitle">Create Group</h3>
        <div class="modal-sub">Organize your customers into groups for easy management</div>
        
        <div class="fld">
          <label>Group Name</label>
          <input type="text" id="f_groupName" placeholder="e.g., VIP Clients, Corporate" />
        </div>

        <div class="fld">
          <label>Description</label>
          <textarea id="f_groupDesc" placeholder="What is this group for?"></textarea>
        </div>

        <div class="fld">
          <label>Color</label>
          <div class="swatch-row" id="swatchRow">
            <!-- Color swatches generated by JS -->
          </div>
        </div>

        <div class="modal-actions">
          <button class="btn" onclick="closeModal('groupModal')">Cancel</button>
          <button class="btn btn-primary" onclick="saveGroup()">Save Group</button>
        </div>
      </div>
    </div>

    <div class="toast-wrap" id="toastWrap"></div>

    <script>
      const COLORS = [
        "#e74c7a", "#c4714a", "#c9a85c", "#2ecc71", "#3498db",
        "#9b59b6", "#1abc9c", "#e67e22", "#95a5a6", "#34495e"
      ];

      let groups = [
        {
          id: 1,
          name: "VIP Clients",
          description: "Premium clients with priority support",
          color: "#e74c7a",
          members: 5,
          created: "2026-08-15"
        },
        {
          id: 2,
          name: "Corporate",
          description: "B2B and corporate customers",
          color: "#3498db",
          members: 12,
          created: "2026-08-10"
        },
        {
          id: 3,
          name: "New Leads",
          description: "Recently added prospects",
          color: "#2ecc71",
          members: 8,
          created: "2026-08-08"
        }
      ];

      let currentGroupId = null;
      let selectedColor = COLORS[0];

      const $ = (id) => document.getElementById(id);
      const toast = (msg, type = "success") => {
        const el = document.createElement("div");
        el.className = `toast ${type}`;
        el.textContent = msg;
        $("toastWrap").appendChild(el);
        setTimeout(() => el.remove(), 2600);
      };

      function renderSwatches() {
        $("swatchRow").innerHTML = COLORS.map(c => `
          <div class="swatch ${c === selectedColor ? 'active' : ''}" 
               style="background: ${c};" 
               onclick="selectColor('${c}')"></div>
        `).join("");
      }

      function selectColor(color) {
        selectedColor = color;
        renderSwatches();
      }

      function renderGroupsList() {
        $("groupsList").innerHTML = groups.map(g => `
          <tr onclick="showGroupDetail(${g.id})">
            <td><input type="checkbox" class="checkbox" /></td>
            <td><div class="name-cell"><span class="color-dot" style="background: ${g.color};"></span><span><strong>${g.name}</strong></span></div></td>
            <td><div class="color-dot" style="background: ${g.color}; width: 16px; height: 16px;"></div></td>
            <td>${g.members}</td>
            <td>${g.created}</td>
            <td><div class="act-icons"><i class="fas fa-eye" onclick="event.stopPropagation(); showGroupDetail(${g.id})"></i><i class="fas fa-trash" onclick="event.stopPropagation(); deleteGroup(${g.id})"></i></div></td>
          </tr>
        `).join("");
      }

      function showGroupDetail(id) {
        currentGroupId = id;
        const g = groups.find(x => x.id === id);
        if (!g) return;
        
        $("detailName").textContent = g.name;
        $("detailColorDot").style.background = g.color;
        $("detailDesc").textContent = g.description || "No description";
        $("detailMemberCount").textContent = g.members;

        $("screenGroupsList").classList.add("hidden");
        $("screenGroupDetail").classList.remove("hidden");
      }

      function backToList() {
        $("screenGroupDetail").classList.add("hidden");
        $("screenGroupsList").classList.remove("hidden");
      }

      function openCreateGroupModal() {
        currentGroupId = null;
        selectedColor = COLORS[0];
        $("groupModalTitle").textContent = "Create Group";
        $("f_groupName").value = "";
        $("f_groupDesc").value = "";
        renderSwatches();
        $("groupModal").classList.add("open");
      }

      function openEditGroupModal() {
        if (!currentGroupId) return;
        const g = groups.find(x => x.id === currentGroupId);
        if (!g) return;

        selectedColor = g.color;
        $("groupModalTitle").textContent = "Edit Group";
        $("f_groupName").value = g.name;
        $("f_groupDesc").value = g.description;
        renderSwatches();
        $("groupModal").classList.add("open");
      }

      function saveGroup() {
        const name = $("f_groupName").value.trim();
        const desc = $("f_groupDesc").value.trim();

        if (!name) {
          toast("Group name is required", "error");
          return;
        }

        if (currentGroupId) {
          const g = groups.find(x => x.id === currentGroupId);
          if (g) {
            g.name = name;
            g.description = desc;
            g.color = selectedColor;
          }
          toast("Group updated");
          closeModal("groupModal");
          showGroupDetail(currentGroupId);
        } else {
          const newGroup = {
            id: Math.max(...groups.map(x => x.id), 0) + 1,
            name,
            description: desc,
            color: selectedColor,
            members: 0,
            created: new Date().toISOString().split('T')[0]
          };
          groups.push(newGroup);
          toast("Group created successfully");
          closeModal("groupModal");
          renderGroupsList();
        }
      }

      function deleteGroup(id) {
        if (!confirm("Delete this group?")) return;
        groups = groups.filter(x => x.id !== id);
        toast("Group deleted");
        renderGroupsList();
      }

      function closeModal(id) {
        $(id).classList.remove("open");
      }

      renderGroupsList();
    </script>
  </body>
</html>
