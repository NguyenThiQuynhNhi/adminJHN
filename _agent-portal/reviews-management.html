<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reviews Management — YUUSHI Agent</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><style>:root{--bg:#f7f2e9;--card:#fffdf8;--line:#e5d9c0;--text:#3b2f2a;--accent:#a85f3b;--muted:#7d7069}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}main{padding:28px;max-width:1400px;margin:auto}h1{margin:0 0 8px}.sub{color:var(--muted);margin-bottom:22px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px}.hidden{display:none!important}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%}th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{font-size:12px;color:var(--muted)}button{font:inherit;border:1px solid var(--line);border-radius:7px;background:#fff;padding:8px 12px;cursor:pointer}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.head{display:flex;align-items:center;gap:12px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.grid div{border:1px solid var(--line);border-radius:8px;padding:12px}.grid small{color:var(--muted)}.grid p{margin:5px 0 0;font-weight:600}.badge{display:inline-block;padding:4px 8px;border-radius:14px;background:#fff1cc;color:#8a5b00}.event{border-left:2px solid #c4a25f;padding:8px 12px;margin:8px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><main><section id="list"><h1>Reviews Management</h1><p class="sub">Review transaction verification cases and submit evidence for exceptions.</p><div class="card table-wrap"><table><thead><tr><th>Transaction ID</th><th>Property / Project / Type / Lot</th><th>Client</th><th>Agency Price</th><th>Client Price</th><th>Status</th><th>Updated</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></section><section id="detail" class="hidden"></section></main><script src="../mock-workflows.js"></script><script>
const W=YuushiWorkflow;W.seedTransactionCases();const $=id=>document.getElementById(id);let currentId=null;const reviewRows=()=>W.read(W.keys.transactions).filter(t=>t.transactionSource==='Yuushi Client Transaction'&&(t.verificationStatus||t.clientResponseState==='awaiting'));
function render(){const rows=reviewRows();$('rows').innerHTML=rows.map(t=>`<tr><td>${W.esc(t.transactionId)}</td><td>${W.esc(t.propertyName)}</td><td>${W.esc(t.clientName||'—')}</td><td>${W.money(t.agentSubmittedPrice)}</td><td>${W.money(t.clientSubmittedPrice)}</td><td>${W.statusBadge(t.verificationStatus||'Awaiting Client')}</td><td>${W.esc(t.updatedAt||'—')}</td><td><button data-id="${W.esc(t.transactionId)}">View</button></td></tr>`).join('')||'<tr><td colspan="8">No review transactions.</td></tr>';$('rows').querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.id));}
function actor(t){return t.closedByStaffId?['Closed By',t.closedByStaffName,t.closedByRole]:['Recorded By',t.recordedByStaffName,t.recordedByRole]}
function show(id){const t=W.read(W.keys.transactions).find(x=>x.transactionId===id);if(!t)return;currentId=id;const a=actor(t),exception=['Mismatch / Needs Review'].includes(t.verificationStatus);$('list').classList.add('hidden');$('detail').classList.remove('hidden');$('detail').innerHTML=`<div class="head"><button id="back">← Back</button><h1>${W.esc(t.transactionId)}</h1>${W.statusBadge(t.verificationStatus||'Awaiting Client')}</div><div class="card"><h2>Transaction Review</h2><div class="grid">${[['Source',t.transactionSource],['Asset',t.propertyName],['Sold Date',t.soldDate],[a[0],(a[1]||'—')+(a[2]?' · '+a[2]:'')],['Agency-entered Price',W.money(t.agentSubmittedPrice)],['Client-entered Price',W.money(t.clientSubmittedPrice)],['Listed Price',W.money(t.listedPrice)],['Review',t.review?`${t.review.rating}/5 · ${t.review.comment||'No comment'}`:'—']].map(x=>`<div><small>${x[0]}</small><p>${W.esc(x[1]||'—')}</p></div>`).join('')}</div></div>${exception?'<div class="card"><h2>Exception Evidence</h2><p>Use this workspace to submit evidence for an existing exception state.</p><button class="primary" id="evidence">Submit Evidence</button></div>':''}<div class="card"><h2>Timeline</h2>${W.timeline(t.timeline)}</div>`;$('back').onclick=back;if(exception)$('evidence').onclick=submitEvidence;}
function back(){$('detail').classList.add('hidden');$('list').classList.remove('hidden');currentId=null;render()}
function submitEvidence(){const t=W.read(W.keys.transactions).find(x=>x.transactionId===currentId);W.modal('Submit Exception Evidence','<label>Agency Explanation<textarea id="reason" required maxlength="1000" placeholder="Explain why the transaction details should be reviewed."></textarea></label><label>Evidence file<input type="file" id="file" required></label>',d=>{const reason=d.querySelector('#reason').value.trim(),file=d.querySelector('#file').files[0];if(!reason||!file)throw Error('Agency Explanation and evidence file are required.');const at=W.now(),ticketId=W.next(W.read(W.keys.tickets),'TK-DISPUTE-'),evidence={filename:file.name,size:file.size,type:file.type,lastModified:file.lastModified,receivedAt:at};W.upsert(W.keys.tickets,{...W.unassigned(),id:ticketId,name:t.agencyName,email:'agency@example.test',category:'Transaction Exception Evidence',status:'Open',created:at.slice(0,10),title:'Transaction Exception · '+t.propertyName,transactionId:t.transactionId,propertyId:t.propertyId,agencyId:t.agencyId,disputeReason:reason,evidence,messages:[]});W.updateTransaction(t.transactionId,'Agency submitted exception evidence',{verificationStatus:'Evidence Submitted',disputeTicketId:ticketId,disputeReason:reason,evidence},W.currentAgencyActor().name);show(t.transactionId);W.notify('Exception evidence submitted.');},'Submit evidence')}
render();
</script></body></html>
