<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Reviews — YUUSHI</title><style>:root{--bg:#f8f4ec;--card:#fff;--line:#e5d9c0;--text:#3c302b;--accent:#a65f3c;--muted:#796d66}*{box-sizing:border-box}body{margin:0;padding:28px;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}main{max-width:1100px;margin:auto}h1{margin:0 0 8px}.sub{color:var(--muted);margin-bottom:22px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.grid div{padding:10px;border:1px solid var(--line);border-radius:8px}.grid small{color:var(--muted)}.grid p{margin:5px 0 0;font-weight:600}button,input,textarea,select{font:inherit}button{padding:8px 12px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer}.primary{background:var(--accent);color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.status{display:inline-block;background:#fff1cc;color:#805900;padding:4px 8px;border-radius:14px}.empty{color:var(--muted)}</style></head><body><main><h1>My Reviews</h1><p class="sub">Confirm your Yuushi transaction details and review verified experiences.</p><div id="rows"></div></main><script src="../mock-workflows.js"></script><script>
const W=YuushiWorkflow;W.seedTransactionCases();const $=id=>document.getElementById(id);function eligible(t){return t.verificationStatus==='Matched'||t.verificationStatus==='Admin Resolved'&&t.adminResolutionAccepted===true}function render(){const rows=W.read(W.keys.transactions).filter(t=>t.transactionSource==='Yuushi Client Transaction'&&t.clientId);$('rows').innerHTML=rows.map(t=>`<article class="card"><div class="grid"><div><small>Property / Project asset</small><p>${W.esc(t.propertyName)}</p></div><div><small>Agency</small><p>${W.esc(t.agencyName)}</p></div><div><small>Sold Date</small><p>${W.esc(t.soldDate||'—')}</p></div><div><small>Agency-entered Price</small><p>${W.money(t.agentSubmittedPrice)}</p></div><div><small>Status</small><p><span class="status">${W.esc(t.verificationStatus||'Awaiting response')}</span></p></div></div><div class="actions">${t.clientResponseState==='awaiting'?`<button class="primary" onclick="respond('${W.esc(t.transactionId)}',false)">Confirm transaction</button><button onclick="respond('${W.esc(t.transactionId)}',true)">Details are incorrect</button>`:''}${eligible(t)&&!t.review?`<button onclick="reviewTx('${W.esc(t.transactionId)}')">Write review</button>`:''}${t.review?`<span>Review: ${t.review.rating}/5 · ${W.esc(t.review.comment||'No comment')}</span>`:''}</div></article>`).join('')||'<div class="card empty">No review transactions are currently available.</div>'}
function respond(id,incorrect){if(incorrect){if(!confirm('Indicate that this transaction or its details are incorrect?'))return;try{W.clientRespond(id,null,true);render()}catch(e){alert(e.message)}return}W.modal('Confirm transaction','<p>Enter the actual transaction price independently. The Agency-entered value is intentionally not copied here.</p>'+W.field('Actual transaction price','clientPrice','','number','min="1" step="1" required'),d=>{W.clientRespond(id,Number(d.querySelector('#clientPrice').value),false);render()},'Confirm')}
function reviewTx(id){W.modal('Write review','<label>Rating<select id="rating" required><option value="">Select...</option><option value="5">5</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select></label><label>Comment<textarea id="comment" maxlength="1000"></textarea></label>',d=>{W.submitClientReview(id,Number(d.querySelector('#rating').value),d.querySelector('#comment').value);render()},'Submit review')};render();
</script></body></html>
