<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transaction Verification</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><style>
:root{--bg-body:#f5f3ef;--bg-card:#fffaf2;--border-subtle:#eadccd;--border-strong:#d9c8b4;--accent:#c26b41;--accent-dark:#a55232;--gold:#c4a25f;--text-main:#3b2f2a;--text-muted:#7a6a5c}*{box-sizing:border-box}body{margin:0;padding:24px 32px;background:var(--bg-body);color:var(--text-main);font:13px system-ui,-apple-system,"Segoe UI",sans-serif}h1{font-size:24px;margin:0}h2{font-size:18px}header.page-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.kpis>div{padding:16px;background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:12px}.kpis strong{display:block;font-size:26px;margin-top:8px}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:12px;text-align:left;border-bottom:1px solid var(--border-subtle)}th{background:#f0e8de;font-size:12px}th button{font:inherit;border:0;background:none;cursor:pointer;color:inherit}td p{margin:4px 0}.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}button:disabled{opacity:.5;cursor:not-allowed}a{color:var(--accent-dark)}.muted{color:var(--text-muted)}.hidden{display:none!important}@media(max-width:700px){body{padding:16px}header.page-head{align-items:flex-start;flex-direction:column}}
</style><script src="../mock-workflows.js"></script></head><body><section id="listView"><header class="page-head"><h1>Transaction Verification</h1></header><div id="kpis" class="kpis"></div><div class="wf-card"><div class="wf-fields"><label>Search<input id="search" placeholder="Transaction, property or client"></label><label>Agency<select id="agency"><option value="">All</option></select></label><label>Agent<select id="agent"><option value="">All</option></select></label><label>Verification Status<select id="status"><option value="">All</option></select></label><label>Has Ticket<select id="hasTicket"><option value="">All</option><option value="yes">Yes</option><option value="no">No</option></select></label><label>Outlier Only<input type="checkbox" id="outlier"></label><label>Sold From<input type="date" id="from"></label><label>Sold To<input type="date" id="to"></label></div><p class="muted">Potential Outlier: difference ≥20% versus Agent Submitted Price. Warning only.</p><div class="wf-scroll"><table><thead><tr id="head"></tr></thead><tbody id="rows"></tbody></table></div><div id="pager" class="pager"></div></div></section><section id="detailView" class="hidden"></section><script>

const W=YuushiWorkflow,$=id=>document.getElementById(id);W.initUI();let pageNo=1,sortKey='updatedAt',sortDirection=-1,currentId=null;const pageSize=10;
const columns=[['transactionId','Transaction ID'],['propertyName','Property'],['agencyName','Agency'],['listingOwnerName','Agent'],['clientName','Client'],['listedPrice','Listed Price'],['agentSubmittedPrice','Agent Price'],['clientSubmittedPrice','Client Price'],['discrepancyPercent','Difference'],['verificationStatus','Verification Status'],['disputeTicketId','Related Ticket'],['updatedAt','Updated Date']];
$('head').innerHTML=columns.map(([key,label])=>`<th><button data-sort="${key}">${label} ↕</button></th>`).join('')+'<th>Action</th>';
$('head').onclick=e=>{const key=e.target.dataset.sort;if(!key)return;sortDirection=sortKey===key?-sortDirection:1;sortKey=key;renderList();};
$('status').innerHTML='<option value="">All</option>'+W.statuses.map(s=>`<option>${s}</option>`).join('');
function refreshOptions(){const rows=W.read(W.keys.transactions);for(const [el,id,label] of [['agency','agencyId','agencyName'],['agent','listingOwnerId','listingOwnerName']]){const prior=$(el).value;$(el).innerHTML='<option value="">All</option>'+W.options([...new Map(rows.map(t=>[t[id],{id:t[id],name:t[label]}])).values()],prior);}}
function renderList(){const all=W.read(W.keys.transactions);$('kpis').innerHTML=W.statuses.slice(0,5).map(s=>`<div>${W.esc(s==='Pending Client Confirmation'?'Pending Confirmation':s)}<strong>${all.filter(t=>t.verificationStatus===s).length}</strong></div>`).join('');const q=$('search').value.toLowerCase();const rows=all.filter(t=>(!q||[t.transactionId,t.propertyName,t.clientName,t.agencyName].join(' ').toLowerCase().includes(q))&&(!$('agency').value||t.agencyId===$('agency').value)&&(!$('agent').value||t.listingOwnerId===$('agent').value)&&(!$('status').value||t.verificationStatus===$('status').value)&&(!$('hasTicket').value||!!t.disputeTicketId===($('hasTicket').value==='yes'))&&(!$('outlier').checked||W.discrepancy(t)>=20)&&(!$('from').value||t.soldDate>=$('from').value)&&(!$('to').value||t.soldDate<=$('to').value)).sort((a,b)=>{const av=a[sortKey]??'',bv=b[sortKey]??'';return (typeof av==='number'&&typeof bv==='number'?av-bv:String(av).localeCompare(String(bv)))*sortDirection;});const pages=Math.max(1,Math.ceil(rows.length/pageSize));pageNo=Math.min(pageNo,pages);$('rows').innerHTML=rows.slice((pageNo-1)*pageSize,pageNo*pageSize).map(t=>`<tr>${columns.map(([k])=>`<td>${k==='verificationStatus'?W.statusBadge(t[k])+W.outlier(t):['listedPrice','agentSubmittedPrice','clientSubmittedPrice'].includes(k)?W.money(t[k]):k==='discrepancyPercent'?(t.clientSubmittedPrice==null?'—':W.money(Math.abs(t.clientSubmittedPrice-t.agentSubmittedPrice))+' / '+W.discrepancy(t).toFixed(2)+'%'):W.esc(t[k]||'—')}</td>`).join('')}<td><button class="wf-btn" data-id="${W.esc(t.transactionId)}">View</button></td></tr>`).join('')||'<tr><td colspan="13">No transactions match your filters.</td></tr>';$('pager').innerHTML=`<span>${rows.length} transactions · Page ${pageNo} of ${pages}</span><div><button class="wf-btn" onclick="pageNo--;renderList()" ${pageNo<=1?'disabled':''}>Previous</button><button class="wf-btn" onclick="pageNo++;renderList()" ${pageNo>=pages?'disabled':''}>Next</button></div>`;}
function showDetail(id){const t=W.read(W.keys.transactions).find(t=>t.transactionId===id);if(!t)return;currentId=id;const ticket=W.read(W.keys.tickets).find(x=>x.id===t.disputeTicketId);$('listView').classList.add('hidden');$('detailView').classList.remove('hidden');$('detailView').innerHTML=`<header class="page-head"><button class="wf-btn" id="back">← Back</button><h1>${W.esc(t.transactionId)}</h1>${W.statusBadge(t.verificationStatus)} ${W.outlier(t)}</header><section class="wf-card"><h2>Property and Transaction</h2><div class="wf-grid">${[['Property',t.propertyName+' · '+t.propertyId],['Agency',t.agencyName+' · '+t.agencyId],['Agent',t.listingOwnerName],['Client',t.clientName],['Listed Price',W.money(t.listedPrice)],['Agent Submitted Price',W.money(t.agentSubmittedPrice)],['Client Submitted Price',W.money(t.clientSubmittedPrice)],['Final Sale Price',W.money(t.finalSalePrice)],['Difference',t.clientSubmittedPrice==null?'—':W.money(Math.abs(t.clientSubmittedPrice-t.agentSubmittedPrice))+' ('+W.discrepancy(t).toFixed(2)+'%)'],['Sold Date',t.soldDate],['Publish Price',t.publishPrice?'Public':'Private']].map(([k,v])=>`<div><small>${k}</small><p>${W.esc(v)}</p></div>`).join('')}</div></section><section class="wf-card"><h2>Dispute and Evidence</h2><p>Related Support Ticket: ${t.disputeTicketId?`<a href="../messagesupport/ticket-management.html?id=${encodeURIComponent(t.disputeTicketId)}">${W.esc(t.disputeTicketId)}</a>`:'—'}</p><p>Evidence filename: ${W.esc(t.evidence?.filename||ticket?.evidence?.filename||'—')}</p><p>Agency dispute reason: ${W.esc(t.disputeReason||ticket?.disputeReason||'—')}</p><p>Proposed correct price: ${W.money(t.proposedCorrectPrice??ticket?.proposedCorrectPrice)}</p><p>Agency note: ${W.esc(t.agencyNote||ticket?.note||'—')}</p></section><section class="wf-card"><h2>Admin Review</h2><p>Admin internal note: ${W.esc(t.adminNote||'—')}</p><div class="wf-fields">${['Use Agent Price','Use Client Price','Enter Corrected Price','Request More Evidence','Reject Verification'].map(action=>`<button class="wf-btn" data-action="${action}" ${action==='Use Client Price'&&t.clientSubmittedPrice==null?'disabled':''}>${action}</button>`).join('')}</div></section><section class="wf-card"><h2>Verification timeline</h2>${W.timeline(t.timeline)}</section>`;$('back').onclick=()=>{$('detailView').classList.add('hidden');$('listView').classList.remove('hidden');currentId=null;renderList();};$('detailView').querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>review(b.dataset.action));}
function review(action){const id=currentId,t=W.read(W.keys.transactions).find(t=>t.transactionId===id);W.modal(action,`<p>Confirm “${W.esc(action)}” for ${W.esc(id)}.</p>${action==='Enter Corrected Price'?W.field('Corrected Final Sale Price','correctedPrice',t.finalSalePrice,'number','min="1" step="1" required'):''}<label>Admin internal note<textarea id="adminNote" maxlength="2000" ${['Request More Evidence','Reject Verification'].includes(action)?'required':''}>${W.esc(t.adminNote||'')}</textarea></label>`,d=>{const fresh=W.read(W.keys.transactions).find(t=>t.transactionId===id);const patch={adminNote:d.querySelector('#adminNote').value.trim()};if(action==='Request More Evidence')patch.verificationStatus='Evidence Submitted';else if(action==='Reject Verification')patch.verificationStatus='Rejected';else {patch.finalSalePrice=action==='Use Agent Price'?fresh.agentSubmittedPrice:action==='Use Client Price'?fresh.clientSubmittedPrice:Number(d.querySelector('#correctedPrice').value);if(!Number.isSafeInteger(patch.finalSalePrice)||patch.finalSalePrice<=0)throw Error('A positive whole JPY price is required.');patch.verificationStatus='Admin Resolved';}W.updateTransaction(id,action,patch);showDetail(id);renderList();W.notify('Transaction verification updated.');},'Confirm');}
$('rows').onclick=e=>{const b=e.target.closest('[data-id]');if(b)showDetail(b.dataset.id);};document.querySelectorAll('.wf-fields input,.wf-fields select').forEach(el=>el.addEventListener('input',()=>{pageNo=1;renderList();}));addEventListener('storage',e=>{if([W.keys.transactions,W.keys.tickets].includes(e.key)){refreshOptions();renderList();if(currentId)showDetail(currentId);}});refreshOptions();renderList();const requested=new URLSearchParams(location.search).get('id');if(requested)showDetail(requested);

</script></body></html>
