<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin — SEO Management</title>
    <link rel="stylesheet" href="seo-management.css" />
    <script defer src="seo-management.js"></script>
  <link rel="stylesheet" href="../dropdown-indicators.css">
</head>
  <body>
    <header>
      <div>
        <h1>SEO Management</h1>
        <p class="muted">
          Manage search appearance and social sharing for public pages.
        </p>
      </div>
    </header>

    <nav aria-label="SEO sections">
      <button data-tab="overview" class="selected">Overview</button
      ><button data-tab="global">Global Settings</button
      ><button data-tab="property">Property Detail</button
      ><button data-tab="agency">Agency Profile</button
      ><div class="insight-nav" role="group" aria-label="Insight SEO">
        <button data-tab="insight">Insight</button>
        <div class="insight-subtypes">
          <button data-tab="areaGuide">Area Guide</button>
          <button data-tab="article">Article</button>
          <button data-tab="news">News</button>
          <button data-tab="faq">FAQ</button>
        </div>
      </div>
    </nav>
    <main id="content"></main>
    <dialog id="overrideDialog" aria-labelledby="overrideHeading"></dialog>
    <div id="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
