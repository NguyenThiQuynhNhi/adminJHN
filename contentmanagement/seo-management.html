<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin — SEO Management</title>
    <link rel="stylesheet" href="seo-management.css" />
    <script defer src="seo-management.js"></script>
  <link rel="stylesheet" href="../dropdown-indicators.css">
</head>
  <body>
    <header>
      <div>
        <h1>SEO Management</h1>
        <p class="muted">
          Manage search appearance and social sharing for public pages.
        </p>
      </div>
    </header>

    <nav class="seo-primary-nav" aria-label="SEO sections">
      <button data-tab="global" class="selected">Global Settings</button>
      <button data-tab="property">Property Detail</button>
      <button data-tab="agency">Agency Profile</button>
      <button data-tab="insight">Insight</button>

      <button data-tab="article">Article</button>
      <button data-tab="news">News</button>
      <button data-tab="faq">FAQ</button>

    <main id="content"></main>
    <div id="toast" role="status" aria-live="polite" hidden></div>
