<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Area Guides</title>
    <style id="uxTableOverflowFix">
@media (max-width: 1199px) {
  table {
    display: block;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
}
</style>
  <style id="uxBaselinePolish">
body {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

button, .btn, [role="button"], select,
input[type="checkbox"], input[type="radio"], input[type="submit"],
input[type="button"], a[href], label[for] {
  cursor: pointer;
}

button:disabled, .btn:disabled, input:disabled, select:disabled, textarea:disabled {
  cursor: not-allowed;
  opacity: 0.6;
}

button:focus-visible, .btn:focus-visible,
a:focus-visible, [role="button"]:focus-visible,
input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid #c4a25f;
  outline-offset: 2px;
}

input, select, textarea, button {
  font-family: inherit;
}

img, svg, video {
  max-width: 100%;
  height: auto;
}

button:hover:not(:disabled), .btn:hover:not(:disabled) {
  filter: brightness(0.96);
  transition: filter 0.15s ease;
}

::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}
::-webkit-scrollbar-track {
  background: #f5ece0;
}
::-webkit-scrollbar-thumb {
  background: #d9c8b4;
  border-radius: 6px;
}
::-webkit-scrollbar-thumb:hover {
  background: #c4a25f;
}

::selection {
  background: #c4a25f;
  color: #fff;
}

hr {
  border: none;
  border-top: 1px solid #eadccd;
  margin: 12px 0;
}

a {
  color: #8a5a3b;
  text-decoration: none;
}
a:hover {
  text-decoration: underline;
}
</style>
</head>
  <body>
    <style>
      .area-guide-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }
      .area-guide-search {
        min-width: 240px;
        flex: 1;
      }
      .area-guide-section {
        margin-top: 18px;
      }
      .area-guide-section-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
        padding: 0 2px;
      }
      .area-guide-section-title {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .area-guide-section-title h3 {
        margin: 0;
        font-size: 16px;
        font-weight: 800;
        color: var(--text-primary);
      }
      .area-guide-section-title p {
        margin: 0;
        font-size: 12px;
        color: var(--text-muted);
      }
      .area-guide-section-meta {
        font-size: 12px;
        color: var(--text-muted);
        white-space: nowrap;
      }
      .area-guide-table-wrap {
        overflow: hidden;
        border-radius: 16px;
        border: 1px solid rgba(138, 93, 46, 0.12);
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 12px 26px rgba(56, 38, 18, 0.05);
      }
      .area-guide-table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
      }
      .area-guide-table thead th {
        background: linear-gradient(180deg, rgba(247, 239, 227, 0.98), rgba(238, 226, 208, 0.98));
        color: #5f4631;
        font-size: 10.5px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-weight: 700;
        padding: 12px 12px;
        border-bottom: 1px solid rgba(138, 93, 46, 0.12);
        white-space: nowrap;
      }
      .area-guide-table tbody td {
        padding: 12px 12px;
        border-bottom: 1px solid rgba(138, 93, 46, 0.08);
        vertical-align: top;
      }
      .area-guide-table tbody tr {
        transition: background-color 0.15s ease, transform 0.15s ease;
      }
      .area-guide-table tbody tr:hover {
        background: rgba(244, 232, 211, 0.72);
      }
      .area-guide-row.city {
        background: rgba(255, 248, 238, 0.92);
      }
      .area-guide-row.area {
        background: rgba(250, 244, 236, 0.98);
      }
      .area-guide-row.city td:first-child {
        border-left: 4px solid #8a5d2e;
      }
      .area-guide-row.area td:first-child {
        border-left: 4px solid #c58a45;
      }
      .area-guide-title {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .area-guide-title-main {
        font-weight: 700;
        color: var(--text-primary);
      }
      .area-guide-title-sub {
        font-size: 11px;
        color: var(--text-muted);
      }
      .area-guide-badge-city {
        background: linear-gradient(180deg, #f1dfc9, #e8c9a0);
        color: #744418;
        border: 1px solid rgba(138, 93, 46, 0.14);
      }
      .area-guide-badge-area {
        background: linear-gradient(180deg, #fff0cf, #f8d99a);
        color: #8f5d14;
        border: 1px solid rgba(163, 93, 20, 0.14);
      }
      .area-guide-status {
        font-weight: 700;
      }
      .area-guide-featured {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 9px;
        border-radius: 999px;
        background: #e4f7ec;
        color: #1f6f4a;
        border: 1px solid rgba(31, 111, 74, 0.16);
        font-size: 10px;
        font-weight: 700;
        white-space: nowrap;
      }
      .area-guide-muted {
        color: var(--text-muted);
      }
      @media (max-width: 860px) {
        .area-guide-search {
          min-width: 100%;
        }
      }
    </style>
    <div class="cms-filter-bar">
      <input id="areaGuideSearchInput" class="cms-filter-input area-guide-search" type="text" placeholder="Search title, location, author" />
      <select id="areaGuideStatusFilter" class="filter-select">
        <option value="all">All status</option>
        <option value="published">Published</option>
        <option value="draft">Draft</option>
      </select>
    </div>

    <section class="area-guide-section">
      <div class="area-guide-section-head">
        <div class="area-guide-section-title">
          <h3>City</h3>
        </div>
        <button class="btn btn-primary" type="button" onclick="openCityGuideEditor()">+ New city guide</button>
      </div>
      <div id="areaGuideCityCount" class="area-guide-section-meta"></div>
      <div class="area-guide-table-wrap">
        <table class="area-guide-table">
          <thead>
            <tr>
              <th>Title</th>
              <th>Location</th>
              <th>Status</th>
              <th>Order</th>
              <th>Author</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="areaGuideCityBody">
            <tr>
              <td colspan="6" class="empty-state">Loading city guides...</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div id="areaGuideCityPagination" class="pagination"></div>
    </section>

    <section class="area-guide-section">
      <div class="area-guide-section-head">
        <div class="area-guide-section-title">
          <h3>Area</h3>
        </div>
        <button class="btn btn-primary" type="button" onclick="openAreaGuideEditor()">+ New area guide</button>
      </div>
      <div id="areaGuideAreaCount" class="area-guide-section-meta"></div>
      <div class="area-guide-table-wrap">
        <table class="area-guide-table">
          <thead>
            <tr>
              <th>Title</th>
              <th>Location</th>
              <th>Status</th>
              <th>Author</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="areaGuideAreaBody">
            <tr>
              <td colspan="5" class="empty-state">Loading area guides...</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div id="areaGuideAreaPagination" class="pagination"></div>
    </section>


    <script>
      (function () {
        function render() {
          if (typeof window.resetAreaGuidePage === "function") {
            window.resetAreaGuidePage();
          }
          if (typeof window.renderAreaGuides === "function") {
            window.renderAreaGuides();
          }
        }
        function initAreaGuidePane() {
          ["areaGuideStatusFilter"].forEach((id) => {
            const el = document.getElementById(id);
            if (el) el.addEventListener("change", render);
          });
          const searchEl = document.getElementById("areaGuideSearchInput");
          if (searchEl) searchEl.addEventListener("input", render);
          render();
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", initAreaGuidePane);
        } else {
          initAreaGuidePane();
        }
      })();
    </script>
  </body>
</html>
