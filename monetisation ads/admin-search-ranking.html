<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YUUSHI Admin — Search Ranking</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root {
    --bg: #f8f4ed;
    --card: #ffffff;
    --border: #e5d9c0;
    --gold: #c4a25f;
    --gold-soft: #f4e9d0;
    --dark: #2c1810;
    --muted: #6b5c4e;
    --red: #c41e3a;
    --green: #2e7d32;
    --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);

    --ys-primary: var(--dark);
    --ys-secondary: var(--muted);
    --ys-accent: var(--gold);
    --ys-accent-hover: #a8863f;
    --ys-bg-body: var(--bg);
    --ys-bg-surface: var(--card);
    --ys-border: var(--border);
    --ys-border-focus: var(--gold);
    --ys-tag-bg: var(--gold-soft);
    --ys-tag-text: #8a5d2e;
    --ys-tag-border: var(--border);
    --ys-success: var(--green);
    --ys-error: var(--red);
    --ys-font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    background-color: var(--ys-bg-body);
    color: var(--ys-primary);
    font-family: var(--ys-font-family);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    line-height: 1.5;
}

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: #f5ece0; }
::-webkit-scrollbar-thumb { background: #d9c8b4; border-radius: 6px; }
::-webkit-scrollbar-thumb:hover { background: #c4a25f; }
::selection { background: #c4a25f; color: #fff; }

h1, h2, h3, h4, h5, h6 { margin-top: 0; color: var(--ys-primary); font-weight: 600; }

.ys-card {
    background: var(--ys-bg-surface);
    border: 1px solid var(--ys-border);
    border-radius: 10px;
    padding: 24px;
    box-shadow: var(--shadow);
    margin-bottom: 24px;
}

.ys-card-title {
    font-size: 1.05rem;
    margin: 0 0 16px 0;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--gold-soft);
}

.ys-form-group { margin-bottom: 16px; }
.ys-form-label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 8px; color: var(--ys-primary); }

.ys-form-control {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--ys-border);
    border-radius: 6px;
    font-family: var(--ys-font-family);
    font-size: 0.875rem;
    color: var(--ys-primary);
    background-color: var(--ys-bg-surface);
    transition: all 0.2s ease-in-out;
}
.ys-form-control:focus { outline: none; border-color: var(--ys-accent); box-shadow: 0 0 0 3px rgba(196, 162, 95, 0.18); }
.ys-form-control:disabled { background-color: var(--gold-soft); color: var(--ys-secondary); cursor: not-allowed; }
textarea.ys-form-control { resize: vertical; min-height: 80px; }
.ys-helper-text { font-size: 0.75rem; color: var(--ys-secondary); margin-top: 6px; }

.ys-btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 10px 20px; border-radius: 6px; font-weight: 500; font-size: 0.875rem;
    font-family: inherit; cursor: pointer; border: 1px solid transparent;
    transition: background-color 0.2s, transform 0.1s;
}
.ys-btn:active { transform: translateY(1px); }
.ys-btn-primary { background-color: var(--ys-accent); color: #2c1810; font-weight: 600; }
.ys-btn-primary:hover { background-color: var(--ys-accent-hover); color: #fff; }
.ys-btn-secondary { background-color: #ffffff; color: var(--ys-primary); border-color: var(--ys-border); }
.ys-btn-secondary:hover { background-color: var(--gold-soft); }
.ys-btn-danger { background-color: #fff; color: var(--red); border-color: var(--red); }
.ys-btn-danger:hover { background-color: var(--red); color: #fff; }

.ys-tag {
    background: var(--ys-tag-bg); color: var(--ys-tag-text); border: 1px solid var(--ys-tag-border);
    padding: 4px 10px; border-radius: 4px; font-size: 0.75rem;
    display: inline-block; margin: 0 6px 6px 0;
}

.ys-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
.ys-flex-between { display: flex; justify-content: space-between; align-items: center; }

/* App shell */
.app-shell { display: flex; min-height: 100vh; }

.sidebar {
    width: 264px; flex-shrink: 0; background: var(--dark); color: #eadfcf;
    padding: 20px 0; position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.sidebar-brand { padding: 0 20px 20px 20px; font-weight: 700; font-size: 1.05rem; color: #fff; border-bottom: 1px solid rgba(255,255,255,0.12); margin-bottom: 12px; }
.sidebar-brand span { color: var(--gold); }
.sidebar-group { margin-bottom: 4px; }
.sidebar-group-label { padding: 14px 20px 6px; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: #9c8a76; }
.sidebar-link {
    display: flex; align-items: center; gap: 10px; padding: 9px 20px; font-size: 0.85rem;
    color: #d8c9b3; text-decoration: none; cursor: pointer; border-left: 3px solid transparent;
}
.sidebar-link:hover { background: rgba(255,255,255,0.06); color: #fff; }
.sidebar-link.active { background: rgba(196,162,95,0.18); border-left-color: var(--gold); color: #fff; font-weight: 500; }
.sidebar-link .dot { width: 6px; height: 6px; border-radius: 50%; background: #6b5c4e; flex-shrink: 0; }
.sidebar-link .dot.red { background: var(--red); }
.sidebar-link .dot.amber { background: #b9812e; }

.main-area { flex: 1; min-width: 0; }

.topbar {
    background: var(--ys-bg-surface); border-bottom: 1px solid var(--ys-border);
    padding: 14px 30px; display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 10;
}
.topbar-title { font-size: 1.05rem; font-weight: 600; }
.topbar-title .crumb { color: var(--ys-secondary); font-weight: 400; font-size: 0.8rem; display:block; margin-top:2px;}
.topbar-actions { display: flex; align-items: center; gap: 14px; }
.bell { position: relative; cursor: pointer; font-size: 1.1rem; }
.bell .badge {
    position: absolute; top: -6px; right: -8px; background: var(--red); color: #fff;
    font-size: 0.65rem; font-weight: 700; padding: 1px 5px; border-radius: 10px; line-height:1.3;
}
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--gold); color: #2c1810; display:flex;align-items:center;justify-content:center; font-size:0.75rem; font-weight:700; }

.page { display: none; padding: 26px 30px 60px; max-width: 1180px; }
.page.active { display: block; }

.section-intro { color: var(--ys-secondary); font-size: 0.875rem; margin: -6px 0 20px; max-width: 720px; }

.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
.stat-card { background: var(--ys-bg-surface); border: 1px solid var(--ys-border); border-radius: 10px; padding: 18px; box-shadow: var(--shadow); }
.stat-card .label { font-size: 0.75rem; color: var(--ys-secondary); margin-bottom: 6px; }
.stat-card .value { font-size: 1.5rem; font-weight: 700; }
.stat-card .sub { font-size: 0.72rem; margin-top: 4px; }
.stat-card .sub.ok { color: var(--green); }
.stat-card .sub.warn { color: #a35d14; }
.stat-card .sub.err { color: var(--red); }

table.ys-table { width: 100%; border-collapse: collapse; font-size: 0.83rem; }
table.ys-table th {
    text-align: left; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--ys-secondary); padding: 10px 12px; border-bottom: 1px solid var(--ys-border);
}
table.ys-table td { padding: 11px 12px; border-bottom: 1px solid var(--gold-soft); vertical-align: middle; }
table.ys-table tr:last-child td { border-bottom: none; }
table.ys-table tr:hover td { background: #fbf6ec; }

.pill { display: inline-flex; align-items:center; gap:5px; padding: 3px 10px; border-radius: 100px; font-size: 0.72rem; font-weight: 600; }
.pill-green { background: #e3f3e6; color: #1f6f4a; border:1px solid #c7e6cc;}
.pill-blue { background: #e6eefc; color: #2c5282; border:1px solid #c9daf4;}
.pill-amber { background: #fff1d7; color: #a35d14; border:1px solid #f2d9ab;}
.pill-red { background: #fce4e4; color: #a23636; border:1px solid #f0c6c6;}
.pill-gray { background: #efe6d8; color: #6b5c4e; border:1px solid var(--ys-border);}

.ys-alert { border-radius: 10px; padding: 14px 16px; font-size: 0.82rem; margin-bottom: 16px; border: 1px solid; display:flex; gap:10px; align-items:flex-start;}
.ys-alert strong { display:block; margin-bottom:2px; }
.ys-alert.info { background:#e6eefc; border-color:#c9daf4; color:#2c5282;}
.ys-alert.warn { background:#fff1d7; border-color:#f2d9ab; color:#8a5d14;}
.ys-alert.danger { background:#fce4e4; border-color:#f0c6c6; color:#992e2e;}
.ys-alert.success { background:#e3f3e6; border-color:#c7e6cc; color:#1f6f4a;}
.ys-alert .icon { font-size:1rem; line-height:1.4; }

.switch { position: relative; display: inline-block; width: 42px; height: 24px; flex-shrink:0; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch .slider { position: absolute; cursor: pointer; inset: 0; background-color: var(--border); transition: .2s; border-radius: 24px; }
.switch .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .2s; border-radius: 50%; }
.switch input:checked + .slider { background-color: var(--gold); }
.switch input:checked + .slider:before { transform: translateX(18px); }

.row-inline { display:flex; align-items:center; gap:10px; }
.small-muted { font-size: 0.75rem; color: var(--ys-secondary); }
.mono { font-family: ui-monospace, monospace; font-size:0.8rem; background:var(--gold-soft); padding:1px 6px; border-radius:4px;}

.tab-bar { display:flex; gap:4px; border-bottom: 1px solid var(--ys-border); margin-bottom: 20px; }
.tab-btn { padding: 10px 16px; font-size:0.85rem; font-weight:500; color:var(--ys-secondary); cursor:pointer; border-bottom: 2px solid transparent; }
.tab-btn.active { color: #8a5d2e; border-bottom-color: var(--gold); }
.tab-panel { display:none; }
.tab-panel.active { display:block; }

.progress-track { width:100%; height:8px; background:var(--gold-soft); border-radius:8px; overflow:hidden; }
.progress-fill { height:100%; background: var(--gold); }

.modal-overlay { display:none; position:fixed; inset:0; background: rgba(44,24,16,0.45); z-index:100; align-items:center; justify-content:center; padding:20px;}
.modal-overlay.open { display:flex; }
.modal-box { background:#fff; border-radius: 12px; max-width: 460px; width:100%; padding: 24px; box-shadow: 0 24px 70px rgba(29,22,15,0.28); }
.modal-box h3 { font-size:1rem; margin-bottom:10px; }
.modal-box p { font-size:0.85rem; color:var(--ys-secondary); margin-bottom:18px; }
.modal-actions { display:flex; justify-content:flex-end; gap:10px; }

.toast-wrap { position: fixed; bottom: 20px; right: 20px; z-index: 200; display:flex; flex-direction:column; gap:10px; }
.toast { background: var(--dark); color:#f4e9d0; padding: 12px 18px; border-radius: 8px; font-size: 0.82rem; box-shadow: 0 12px 28px rgba(22,28,36,0.22); opacity:0; transform: translateY(8px); transition: all .25s; max-width:320px;}
.toast.show { opacity:1; transform: translateY(0); }

.divider { height:1px; background: var(--gold-soft); margin: 20px 0; }

.kv-list { display:grid; grid-template-columns: 1fr 1fr; gap:10px 20px; font-size:0.82rem; }
.kv-list .k { color: var(--ys-secondary); }

.badge-count { background: var(--red); color:#fff; font-size:0.65rem; font-weight:700; padding:1px 6px; border-radius:10px; margin-left:6px; }

/* Data management scope: land/pricing/finance internal screens */
.data-mgmt {
  --bg-page: #f4efe7;
  --bg-card: #fffdf8;
  --bg-card-warm: #fff7ec;
  --bg-row-hover: #f4ead8;
  --bg-header-soft: #f8f0e4;
  --text-primary: #1b2430;
  --text-muted: #6b7280;
  --text-link: #7a4f25;
  --border-default: #ded3c3;
  --border-warm: #e9dcc8;
  --border-soft: #efe6d8;
  --color-primary: #8a5d2e;
  --color-primary-hover: #69421f;
  --color-primary-light: #d7b07b;
  --status-success-text: #1f6f4a;
  --status-success-bg: #ddf4e7;
  --status-warning-text: #a35d14;
  --status-warning-bg: #fff1d7;
  --status-danger-text: #a23636;
  --status-danger-bg: #fce4e4;
  --status-neutral-text: #556070;
  --status-neutral-bg: #e8edf2;
  --status-info-text: #2c5282;
  --status-info-bg: #e6eefc;
  --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-full: 999px;
  --shadow-card: 0 16px 40px rgba(56, 38, 18, 0.08);
  --shadow-toast: 0 12px 28px rgba(22, 28, 36, 0.22);
  --shadow-modal: 0 24px 70px rgba(29, 22, 15, 0.28);
  background: var(--bg-page);
  margin: -26px -30px -60px;
  padding: 26px 30px 60px;
}
.data-mgmt .ys-card { background: var(--bg-card); border-color: var(--border-default); box-shadow: var(--shadow-card); border-radius: var(--r-lg); }
.data-mgmt .ys-card-title { border-bottom-color: var(--border-soft); color: var(--text-primary); }
.data-mgmt table.ys-table th { color: var(--text-muted); border-bottom-color: var(--border-default); background: var(--bg-header-soft); }
.data-mgmt table.ys-table td { border-bottom-color: var(--border-soft); color: var(--text-primary); }
.data-mgmt table.ys-table tr:hover td { background: var(--bg-row-hover); }
.data-mgmt a { color: var(--text-link); }
.data-mgmt .ys-btn-primary { background: var(--color-primary); color: #fff; }
.data-mgmt .ys-btn-primary:hover { background: var(--color-primary-hover); }
.data-mgmt .ys-form-control { border-color: var(--border-default); }
.data-mgmt .pill-green { background: var(--status-success-bg); color: var(--status-success-text); border-color: transparent;}
.data-mgmt .pill-amber { background: var(--status-warning-bg); color: var(--status-warning-text); border-color: transparent;}
.data-mgmt .pill-red { background: var(--status-danger-bg); color: var(--status-danger-text); border-color: transparent;}
.data-mgmt .pill-gray { background: var(--status-neutral-bg); color: var(--status-neutral-text); border-color: transparent;}
.data-mgmt .pill-blue { background: var(--status-info-bg); color: var(--status-info-text); border-color: transparent;}
.data-mgmt .ys-alert.success { background: var(--status-success-bg); border-color: transparent; color: var(--status-success-text);}
.data-mgmt .ys-alert.warn { background: var(--status-warning-bg); border-color: transparent; color: var(--status-warning-text);}
.data-mgmt .ys-alert.danger { background: var(--status-danger-bg); border-color: transparent; color: var(--status-danger-text);}
.data-mgmt .ys-alert.info { background: var(--status-info-bg); border-color: transparent; color: var(--status-info-text);}
.data-mgmt .stat-card { background: var(--bg-card); border-color: var(--border-default); box-shadow: var(--shadow-card); }
.data-mgmt .mono { background: var(--bg-header-soft); }

@media (max-width: 900px) {
    .stat-row { grid-template-columns: repeat(2,1fr); }
    .ys-grid-2 { grid-template-columns: 1fr; }
    .sidebar { position: fixed; left:-264px; z-index: 50; transition: left .2s; }
    .sidebar.open { left:0; }
}


/* Standalone content-page adaptation: original sidebar/topbar are intentionally omitted. */
body { min-height: 100vh; }
.page { display:block !important; padding:28px 30px 60px; max-width:1180px; margin:0 auto; }
.standalone-page-title { font-size:1.45rem; line-height:1.25; margin:0 0 8px; }
.standalone-page-head { margin-bottom:20px; }
.standalone-page-head + .section-intro { margin-top:-8px; }
@media (max-width: 700px) { .page { padding:20px 16px 40px; } }

</style>
</head>
<body>
<div class="page" id="page-ranking"><div class="standalone-page-head"><h1 class="standalone-page-title">Search Ranking</h1></div>
<p class="section-intro">Search ranking is calculated automatically from plan and rating — there's no bidding.</p>

<div class="ys-grid-2">
<div class="ys-card">
<div class="ys-card-title">Base score by plan</div>
<table class="ys-table">
<tr><th>Plan</th><th>Base score</th></tr>
<tr><td>Free</td><td><input class="ys-form-control" style="width:90px;" value="10"/></td></tr>
<tr><td>Silver</td><td><input class="ys-form-control" style="width:90px;" value="50"/></td></tr>
<tr><td>Gold</td><td><input class="ys-form-control" style="width:90px;" value="100"/></td></tr>
<tr><td>Platinum</td><td><input class="ys-form-control" style="width:90px;" value="500"/></td></tr>
</table>

</div>
<div class="ys-card">
<div class="ys-card-title">Rating multiplier</div>
<div class="ys-form-group">
<label class="ys-form-label">Applies to every plan</label>
<input class="ys-form-control" value="1.2"/>
</div>
<button class="ys-btn ys-btn-primary" onclick="toast('Rating multiplier saved')">Save</button>
</div>
</div>
</div>

<div class="toast-wrap" id="toastWrap"></div>
<script>

function tab(el, id){
  var bar = el.parentElement;
  bar.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  var panelWrap = bar.parentElement;
  panelWrap.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
function toast(msg){
  var wrap = document.getElementById('toastWrap');
  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  wrap.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),300); }, 3800);
}
function handleSuppressionToggle(cb){
  if(!cb.checked){ cb.checked = true; openModal('modalSuppressOff'); }
  else { toast('Detailed figures hidden again'); }
}
function confirmSuppressionToggle(){
  var el=document.getElementById('suppressionToggle'); if(el) el.checked=false;
  closeModal('modalSuppressOff');
  toast('Detailed figures are now visible to all advertisers');
}
function cancelSuppressionToggle(){ closeModal('modalSuppressOff'); }

</script>
</body>
</html>
