<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Badge Management</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><style>
:root{--bg-body:#f5f3ef;--bg-card:#fffaf2;--border-subtle:#eadccd;--border-strong:#d9c8b4;--accent:#c26b41;--accent-dark:#a55232;--gold:#c4a25f;--text-main:#3b2f2a;--text-muted:#7a6a5c}*{box-sizing:border-box}body{margin:0;padding:24px 32px;background:var(--bg-body);color:var(--text-main);font:13px system-ui,-apple-system,"Segoe UI",sans-serif}h1{font-size:24px;margin:0}h2{font-size:18px}header.page-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.kpis>div{padding:16px;background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:12px}.kpis strong{display:block;font-size:26px;margin-top:8px}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:12px;text-align:left;border-bottom:1px solid var(--border-subtle)}th{background:#f0e8de;font-size:12px}th button{font:inherit;border:0;background:none;cursor:pointer;color:inherit}td p{margin:4px 0}.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}button:disabled{opacity:.5;cursor:not-allowed}a{color:var(--accent-dark)}.muted{color:var(--text-muted)}.hidden{display:none!important}@media(max-width:700px){body{padding:16px}header.page-head{align-items:flex-start;flex-direction:column}}
</style><script src="../mock-workflows.js"></script></head><body><header class="page-head"><h1>Badge Management</h1><button class="wf-btn wf-primary" id="createBadge"><i class="fas fa-plus"></i> Create Badge</button></header><div id="kpis" class="kpis"></div><div class="wf-card"><div class="wf-fields"><label>Search badge name<input id="search" placeholder="Badge name"></label></div><div class="wf-scroll"><table><thead><tr><th>Badge Preview</th><th>Badge Name</th><th>Description</th><th>Assigned Agencies</th><th>Created Date</th><th>Updated Date</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div><div id="pager" class="pager"></div></div><script>

const W=YuushiWorkflow,$=id=>document.getElementById(id);W.initUI();W.seedBadges();let pageNo=1;const pageSize=10;
// Same IDs and original badge grants as the Agency Management seed; opening either page first is safe.
const agencySeed=[{id:'AG-00000001',company:'Yamada Estates Co., Ltd.',status:'Active',badges:['Top Agency','Premium Agency']},{id:'AG-00000002',company:'Osaka Premier Realty',status:'Withdrawn',badges:[]},{id:'AG-00000003',company:'Shady Realty Co.',status:'Suspended',badges:[]},...Array.from({length:7},(_,i)=>{const n=i+4;return {id:'AG-'+String(n).padStart(8,'0'),company:'Agency '+n+' Realty Co.',status:['Active','Active','Active','Suspended','Withdrawn'][n%5],badges:n%7===0?['Top Agency']:[]};})];W.syncAgencies(agencySeed);
const icons=['fas fa-award','fas fa-gem','fas fa-star','fas fa-medal','fas fa-crown','fas fa-shield-halved'];
function assignmentCount(id){return Object.values(W.read(W.keys.assignments,{})).filter(ids=>ids.includes(id)).length;}
function render(){const all=W.read(W.keys.badges),assignments=W.read(W.keys.assignments,{});$('kpis').innerHTML=[['Total Badges',all.length],['Total Assignments',Object.values(assignments).reduce((n,ids)=>n+ids.filter(id=>all.some(b=>b.id===id)).length,0)]].map(([label,n])=>`<div>${label}<strong>${n}</strong></div>`).join('');const rows=all.filter(b=>b.name.toLowerCase().includes($('search').value.toLowerCase()));const pages=Math.max(1,Math.ceil(rows.length/pageSize));pageNo=Math.min(pageNo,pages);$('rows').innerHTML=rows.slice((pageNo-1)*pageSize,pageNo*pageSize).map(b=>`<tr><td>${W.badgeHTML(b)}</td><td>${W.esc(b.name)}</td><td style="white-space:normal;min-width:180px">${W.esc(b.description)}</td><td>${assignmentCount(b.id)}</td><td>${W.esc(b.createdAt.slice(0,10))}</td><td>${W.esc(b.updatedAt.slice(0,10))}</td><td>${['View','Edit','Delete','Manage Assignments'].map(action=>`<button class="wf-btn" data-id="${W.esc(b.id)}" data-action="${action}">${action}</button>`).join(' ')}</td></tr>`).join('')||'<tr><td colspan="7">No badges match your search.</td></tr>';$('pager').innerHTML=`<span>${rows.length} badges · Page ${pageNo} of ${pages}</span><div><button class="wf-btn" onclick="pageNo--;render()" ${pageNo<=1?'disabled':''}>Previous</button><button class="wf-btn" onclick="pageNo++;render()" ${pageNo>=pages?'disabled':''}>Next</button></div>`;}
function editBadge(id){const b=W.read(W.keys.badges).find(b=>b.id===id)||{name:'',description:'',iconClass:icons[0],backgroundColor:'#fef3c7',textColor:'#92400e',status:'Active'};W.modal(id?'Edit Badge':'Create Badge',W.field('Badge Name','badgeName',b.name,'text','required maxlength="60"')+'<label>Description<textarea id="badgeDescription" maxlength="200">'+W.esc(b.description)+'</textarea></label><label>Icon<select id="badgeIcon">'+icons.map(icon=>`<option value="${icon}" ${b.iconClass===icon?'selected':''}>${icon.replace('fas fa-','')}</option>`).join('')+'</select></label>'+W.field('Background Color','badgeBackground',b.backgroundColor,'color')+W.field('Text Color','badgeText',b.textColor,'color')+'<h3>Preview</h3><div id="badgePreview"></div>',d=>{const rows=W.read(W.keys.badges),name=d.querySelector('#badgeName').value.trim(),description=d.querySelector('#badgeDescription').value.trim();if(!name||name.length>60||description.length>200)throw Error('Name is required (60 characters maximum); description maximum is 200.');if(name.toLowerCase()==='other')throw Error('Use a specific badge name, not Other.');if(rows.some(x=>x.id!==id&&x.name.toLowerCase()===name.toLowerCase()))throw Error('A badge with this name already exists.');const at=W.now();W.upsert(W.keys.badges,{...b,id:id||W.next(rows,'BADGE-CUSTOM-'),name,description,iconClass:d.querySelector('#badgeIcon').value,backgroundColor:d.querySelector('#badgeBackground').value,textColor:d.querySelector('#badgeText').value,status:'Active',createdAt:b.createdAt||at,updatedAt:at});render();W.notify('Badge saved.');},'Save',d=>{const preview=()=>{d.querySelector('#badgePreview').innerHTML=W.badgeHTML({name:d.querySelector('#badgeName').value||'Badge preview',iconClass:d.querySelector('#badgeIcon').value,backgroundColor:d.querySelector('#badgeBackground').value,textColor:d.querySelector('#badgeText').value});};d.addEventListener('input',preview);preview();});}
function manageAssignments(id){const b=W.read(W.keys.badges).find(b=>b.id===id);W.modal('Manage Assignments — '+b.name,'<label>Search Agency<input id="agencySearch" placeholder="Agency ID or name"></label><div class="wf-scroll"><table><thead><tr><th>Agency ID</th><th>Agency Name</th><th>Status</th><th>Current Badges</th><th>Action</th></tr></thead><tbody id="agencyRows"></tbody></table></div>',null,'',d=>{const renderAgencies=()=>{const q=d.querySelector('#agencySearch').value.toLowerCase(),assignments=W.read(W.keys.assignments,{}),catalog=W.read(W.keys.badges);d.querySelector('#agencyRows').innerHTML=W.read(W.keys.agencies).filter(a=>(a.id+' '+a.name).toLowerCase().includes(q)).map(a=>{const granted=(assignments[a.id]||[]).includes(id);return `<tr><td>${W.esc(a.id)}</td><td>${W.esc(a.name)}</td><td>${W.esc(a.status)}</td><td>${(assignments[a.id]||[]).map(id=>catalog.find(b=>b.id===id)).filter(Boolean).map(W.badgeHTML).join(' ')||'—'}</td><td><button type="button" data-agency="${W.esc(a.id)}" data-granted="${granted}">${granted?'Remove':'Grant'}</button></td></tr>`;}).join('')||'<tr><td colspan="5">No agencies found.</td></tr>';};d.querySelector('#agencySearch').oninput=renderAgencies;d.querySelector('#agencyRows').onclick=e=>{const btn=e.target.closest('[data-agency]');if(!btn)return;const on=btn.dataset.granted!=='true';W.confirm(on?'Grant badge?':'Remove badge?',`${on?'Grant':'Remove'} ${b.name} for ${btn.dataset.agency}?`,()=>{W.grant(btn.dataset.agency,id,on);renderAgencies();render();W.notify('Agency badge assignment updated.');});};renderAgencies();});}
$('rows').onclick=e=>{const btn=e.target.closest('[data-action]');if(!btn)return;const id=btn.dataset.id,action=btn.dataset.action,b=W.read(W.keys.badges).find(b=>b.id===id);if(action==='Edit')return editBadge(id);if(action==='Manage Assignments')return manageAssignments(id);if(action==='View')return W.modal(b.name,`${W.badgeHTML(b)}<p>${W.esc(b.description)}</p><p>Assigned Agencies: ${assignmentCount(id)}</p><p>Created: ${W.esc(b.createdAt)}</p><p>Updated: ${W.esc(b.updatedAt)}</p>`,null);if(action==='Delete'){const count=assignmentCount(id);return W.modal('Delete badge?',`<p>Delete ${W.esc(b.name)}? ${count} Agency assignment(s) will be removed.</p>`,()=>{W.write(W.keys.badges,W.read(W.keys.badges).filter(x=>x.id!==id));const assignments=W.read(W.keys.assignments,{});Object.keys(assignments).forEach(key=>assignments[key]=assignments[key].filter(x=>x!==id));W.write(W.keys.assignments,assignments);render();W.notify('Badge deleted and all Agency assignments removed.');},'Delete');}};$('createBadge').onclick=()=>editBadge();$('search').oninput=()=>{pageNo=1;render();};addEventListener('storage',e=>{if([W.keys.badges,W.keys.assignments,W.keys.agencies].includes(e.key))render();});render();

</script></body></html>
