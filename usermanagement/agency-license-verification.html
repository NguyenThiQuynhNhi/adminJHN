<script>
'use strict';
// Isolated, in-memory mock. No source Agency Management writes, production documents or API calls.
const LicenseVerification=(()=>{
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o)),now=()=>new Date().toISOString(),date=d=>new Date(d).toISOString().slice(0,10),today=date(Date.now()),day=n=>date(Date.now()+n*86400000),stamp=t=>t?new Date(t).toLocaleString('en-GB',{hour12:false}):'—';
const admins=['Aiko Tanaka','Ken Sato','Mina Ito'],teams=['License Review','Compliance','Operations'];
const actor={name:'Aiko Tanaka',team:'License Review',device:'192.0.2.10 / Mock browser'};
const fields=['Licensing Authority','License Number','Expiration Date','Company Name','Address','Renewal Count','Representative Name','Phone Number'];
const permissions=['View Verification Queue','View OCR Result','View Original Document','Download Original Document','Assign Review','Perform Manual Check','Pass Document Review','Return Application','Deny Application','Generate Verification Code','Approve Agency','Manage Verification Settings','View Audit Log','Export Audit Log'];
let profile='Verification Admin';
function can(p){if(profile==='Verification Admin')return true;if(profile==='Read Only')return ['View Verification Queue','View Audit Log'].includes(p);return ['View Verification Queue','View OCR Result','Assign Review','Perform Manual Check','View Audit Log'].includes(p)}
const gateNote='Final approval is available only after the verification code has been confirmed.';
let policy={thresholds:Object.fromEntries([...fields,'License Issue Date'].map(f=>[f,90])),priorities:Object.fromEntries(fields.map((f,i)=>[f,i<4?'High':i<7?'Medium':'Low'])),critical:95,exact:true,normalized:'Accept as normalized match',expiration:24,attempts:5,cooldown:60,retention:90,formats:['PDF','JPG','PNG'],maxSize:10};
const methodOptions=['Registered Email','Eligible Phone','Postal Mail to Official Registry Address'];
const codeStatuses=['Not Generated','Generated','Sent','Awaiting Entry','Confirmed','Expired','Maximum Attempts Reached','Revoked'];
const externalStatuses=['Matched','No Matching Information Found','Connection Failure','Parsing Failure','Timeout','Not Checked','Manually Confirmed'];
const errorStatuses=['Connection Failure','Parsing Failure','Timeout'];
const statuses=['Pending Review','Manual Review Required','Document Review Passed','Contact or Address Verification Required','Verification Code Sent','Awaiting Verification Code','Verification Code Confirmed','Returned for Correction','Denied','Approved'];
const records=Array.from({length:10},(_,i)=>{
 const agency=['Sakura Realty','Tokyo Homes','Osaka Living','Kyoto Estate','Harbor Properties','Fukuoka Realty','Kobe Residence','Nagoya Housing','Sendai Estate','Yokohama Homes'][i];
 const registered={'Licensing Authority':'Tokyo Governor','License Number':`Tokyo (3) ${100101+i}`,'Expiration Date':day(180+i*30),'Company Name':agency+' Co., Ltd.','Address':`${i+1}-2-3 Shibuya, Tokyo`,'Renewal Count':'3','Representative Name':['Hana Yamada','Ken Suzuki'][i%2],'Phone Number':i===4?'090-1234-5678':'03-1234-5678'};
 const r={id:'LVR-'+String(i+1).padStart(4,'0'),agencyId:'AG-'+String(i+1).padStart(4,'0'),agency,license:registered['License Number'],submitted:day(-i),expiry:registered['Expiration Date'],updated:now(),admin:admins[i%3],team:teams[i%3],deadline:day(3),previous:i%3,fraud:i===4?'Potential altered license number — review required':'No warning',duplicate:i===4?'Potential duplicate license reference':'No warning',status:'Pending Review',documentReviewStatus:'Pending',ocrStatus:'Completed',external:'Matched',externalNote:'',checkedBy:actor.name,checkedAt:now(),email:`office${i+1}@example.jp`,officialAddress:registered.Address,phone:registered['Phone Number'],registered,ocr:{...registered,'License Issue Date':day(-365)},corporate:{'Company Name':registered['Company Name'],Address:registered.Address},externalData:{...registered},confidence:Object.fromEntries([...fields,'License Issue Date'].map(f=>[f,98])),notes:[],method:methodOptions[i%3],code:{status:'Not Generated',generatedAt:null,sentAt:null,expiresAt:null,delivery:'Not sent',attempts:0,maxAttempts:5,history:[]},verifiedAt:null,verifiedBy:null,documents:[]};
 r.documents=['Real Estate Transaction Business License','Real Estate Transaction Agent Certificate','Supplementary Document'].map((type,n)=>({id:'doc-'+(n+1),type,name:`${r.id}-${['license','certificate','supplement'][n]}.pdf`,format:'PDF',size:[1.8,1.2,.6][n],uploaded:r.submitted,scan:'Clean',deleteAt:day(90)}));
 return r;
});
records[0].ocrStatus='Processing';records[0].external='Not Checked';
records[7].ocr['Company Name']=records[7].registered['Company Name'].replace(/[A-Za-z]/g,c=>String.fromCharCode(c.charCodeAt(0)+0xfee0));
for(const i of [2,3,9])records[i].documentReviewStatus='Passed';
records[2].status='Awaiting Verification Code';records[2].code={...records[2].code,status:'Awaiting Entry',generatedAt:now(),sentAt:now(),expiresAt:new Date(Date.now()+86400000).toISOString(),delivery:'Delivered (mock)'};
records[3].status='Verification Code Confirmed';records[3].code={...clone(records[2].code),status:'Confirmed',confirmedAt:now()};
records[4].status='Manual Review Required';records[4].ocr['License Number']='Tokyo (9) 999999';records[4].confidence['License Number']=72;
records[5].status='Manual Review Required';records[5].external='Connection Failure';
records[6].status='Manual Review Required';records[6].external='Parsing Failure';
records[7].status='Returned for Correction';records[7].returnReason='License page is incomplete.';
records[8].status='Denied';records[8].denialReason='Manual investigation confirmed an invalid license.';
records[9].status='Approved';records[9].code={...clone(records[3].code)};records[9].verifiedAt=now();records[9].verifiedBy='Mina Ito';
const logs=[];let seq=0,view='queue',currentId=null,filters={},kpi='',selected=new Set(),auditFilters={},rulesDraft=null,rulesDirty=false;
function log(action,r,previous,note='',document=''){logs.unshift({id:++seq,timestamp:now(),admin:actor.name,team:actor.team,action,requestId:r?.id||'—',agency:r?.agency||'—',previous:previous||'—',next:r?.status||'—',document,device:actor.device,note});}
for(const r of records)log('Request Submitted',r,'—','Mock record loaded.');
log('Generate Code',records[2],'Document Review Passed','Mock delivery workflow started.');log('Send Code',records[2],'Verification Code Sent','Mock delivery recorded.');log('Code Confirmed',records[3],'Awaiting Verification Code','Agency confirmation simulated.');log('Approve',records[9],'Verification Code Confirmed','Mock approval notification sent.');
function toast(message){const el=document.createElement('div');el.className='toast';el.textContent=message;$('toasts').append(el);setTimeout(()=>el.remove(),6000)}
function normalize(v){return String(v||'').normalize('NFKC').replace(/[‐‑–—−ー]/g,'-').replace(/[一二三四五六七八九〇]/g,c=>({'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'〇':0}[c])).replace(/株式會社|株式会社|\(株\)/g,'Co.,Ltd.').replace(/髙/g,'高').replace(/﨑/g,'崎').replace(/丁目|番地?|号/g,'-').replace(/\s+/g,'').replace(/-$/,'').toLowerCase()}
function compare(r,f){if(r.ocrStatus!=='Completed')return 'Not Available';const values=[r.registered[f],r.ocr[f],r.corporate[f],r.externalData[f]].filter(v=>v!==undefined&&v!=='');if(errorStatuses.includes(r.external))return 'External Check Error';if(!['Matched','Manually Confirmed'].includes(r.external))return 'Manual Review Required';if(new Set(values.map(normalize)).size>1)return policy.priorities[f]==='High'?'Critical Mismatch':'Mismatch';if((r.confidence[f]||0)<policy.thresholds[f])return 'Low Confidence';if(new Set(values).size>1)return 'Normalized Match';return values.length>=2?'Exact Match':'Not Available'}
function critical(r){const fs=fields.filter(f=>policy.priorities[f]==='High');return fs.length?Math.min(...fs.map(f=>r.confidence[f]||0)):100}
function criticalMismatch(r){return fields.some(f=>policy.priorities[f]==='High'&&r.ocrStatus==='Completed'&&normalize(r.registered[f])!==normalize(r.ocr[f]))}
function match(r){if(r.ocrStatus!=='Completed')return 'Not Available';if(criticalMismatch(r))return 'Critical Mismatch';const results=fields.map(f=>compare(r,f));if(results.includes('External Check Error'))return 'External Check Error';if(results.includes('Mismatch'))return 'Mismatch';if(results.includes('Manual Review Required'))return 'Manual Review Required';if(critical(r)<policy.critical||results.includes('Low Confidence'))return 'Low Confidence';if(results.includes('Normalized Match'))return 'Normalized Match';return 'Full Match'}
function manualRequired(r){return criticalMismatch(r)||critical(r)<policy.critical||fields.some(f=>['Mismatch','Low Confidence','Manual Review Required','External Check Error'].includes(compare(r,f)))||(policy.normalized==='Manual review'&&fields.some(f=>compare(r,f)==='Normalized Match'))||(policy.exact&&fields.some(f=>policy.priorities[f]==='High'&&compare(r,f)==='Not Available'))}
function terminal(r){return ['Approved','Denied','Returned for Correction'].includes(r.status)}
function canApprove(r){return !terminal(r)&&r.documentReviewStatus==='Passed'&&r.code.status==='Confirmed'&&can('Approve Agency')}
function color(t){return /External|Failure|Timeout/.test(t)?'purple':/Critical Mismatch|Denied|Maximum Attempts|Revoked/.test(t)?'red':/Exact Match|Full Match|Confirmed|Approved|Passed|Clean|Matched/.test(t)?'green':/Not Available|Not Checked|Not Generated/.test(t)?'': 'amber'}
const badge=t=>`<span class="badge ${color(t)}">${esc(t)}</span>`;
function button(label,action,permission,disabled=false,extra=''){const denied=permission&&!can(permission);return `<button type="button" class="btn ${extra}" data-action="${action}" ${denied||disabled?'disabled':''} ${denied?'title="Permission required: '+esc(permission)+'"':''}>${label}</button>`}
const options=(vals,value,all=false)=>(all?'<option value="">All</option>':'')+vals.map(v=>`<option ${v===value?'selected':''} value="${esc(v)}">${esc(v)}</option>`).join('');
const select=(id,label,vals,value='',all=false)=>`<label for="${id}">${label}<select id="${id}">${options(vals,value,all)}</select></label>`;
const input=(id,label,type='text',value='')=>`<label for="${id}">${label}<input id="${id}" type="${type}" value="${esc(value)}"></label>`;
const table=(heads,rows)=>`<div class="table-wrap"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${heads.length}" class="empty">No results match the selected filters.</td></tr>`}</tbody></table></div>`;
const kv=(label,value)=>`<div><div class="key">${label}</div><div class="value">${esc(value??'—')}</div></div>`;
function notifyFailure(message){toast(message);return false}
function guard(permission,r,allowTerminal=false){return can(permission)&&(!r||allowTerminal||!terminal(r))||notifyFailure('This action is unavailable for your permissions or the completed request.')}
function modal(title,html,onSubmit,label='Confirm'){ $('dialogTitle').textContent=title;$('dialogBody').innerHTML=html+'<p class="error" id="modalError" role="alert"></p>';$('dialogSubmit').textContent=label;$('dialogSubmit').hidden=!onSubmit;$('dialogForm').onsubmit=e=>{e.preventDefault();const error=onSubmit?.(new FormData(e.target));if(error){$('modalError').textContent=error;return;} $('dialog').close()};$('dialog').showModal()}
function permissionInfo(){return `<details class="card"><summary>Permissions and document data handling</summary><p>Current mock profile: ${esc(profile)}. Sensitive actions are enforced in both controls and action handlers.</p><div class="grid">${permissions.map(p=>`<div>${badge(can(p)?'Granted':'Restricted')} ${p}</div>`).join('')}</div><div class="notice">Restricted document access. OCR provider data is not used for AI model training (mock contractual confirmation). Processing region: Japan (mock). Documents remain in the designated Japan storage region; provider copies are deleted after processing. Originals have retention/delete dates, virus-scan status and access audit history. No production debug images are included. OCR raw results are excluded from standard activity messages.</div></details>`}
function kpiMatch(r,key){return !key||({pending:r.status==='Pending Review',manual:r.status==='Manual Review Required',code:r.documentReviewStatus==='Passed'&&r.status!=='Approved'&&r.code.status!=='Confirmed',external:errorStatuses.includes(r.external),approved:r.status==='Approved'&&r.verifiedAt?.slice(0,7)===today.slice(0,7),returned:['Returned for Correction','Denied'].includes(r.status)})[key]}
const filterDefs=[['keyword','Keyword','text'],['status','Verification Status',statuses],['ocr','OCR Status',['Processing','Completed','Failed']],['match','Match Result',['Full Match','Normalized Match','Mismatch','Critical Mismatch','Low Confidence','Not Available','External Check Error','Manual Review Required']],['external','External Check Result',externalStatuses],['min','Critical Confidence Min','number'],['max','Critical Confidence Max','number'],['from','Submitted Date From','date'],['to','Submitted Date To','date'],['expiryFrom','License Expiry From','date'],['expiryTo','License Expiry To','date'],['admin','Assigned Admin',admins],['team','Assigned Admin Team',teams],['critical','Critical Mismatch',['Yes','No']],['method','Verification Method',methodOptions],['code','Code Status',codeStatuses]];
function filtered(){return records.filter(r=>kpiMatch(r,kpi)&&Object.entries(filters).every(([key,v])=>{if(v==='')return true;switch(key){case'keyword':return [r.id,r.agencyId,r.agency,r.license].join(' ').toLowerCase().includes(v.toLowerCase());case'status':return r.status===v;case'ocr':return r.ocrStatus===v;case'match':return match(r)===v;case'external':return r.external===v;case'min':return critical(r)>=Number(v);case'max':return critical(r)<=Number(v);case'from':return r.submitted>=v;case'to':return r.submitted<=v;case'expiryFrom':return r.expiry>=v;case'expiryTo':return r.expiry<=v;case'critical':return criticalMismatch(r)===(v==='Yes');case'code':return r.code.status===v;default:return r[key]===v}}))}
function renderQueue(){if(!can('View Verification Queue'))return '<div class="empty">Permission required: View Verification Queue</div>';const rows=filtered();return `<div class="summary">${[['pending','Pending Review'],['manual','Manual Review Required'],['code','Awaiting Verification Code'],['external','External Check Error'],['approved','Approved This Month'],['returned','Returned or Denied']].map(([key,label])=>`<button class="card ${kpi===key?'active':''}" data-kpi="${key}">${label}<strong>${records.filter(r=>kpiMatch(r,key)).length}</strong></button>`).join('')}</div><section class="card"><h2>Verification Queue</h2><form id="filters"><div class="filters">${filterDefs.map(([id,label,type])=>Array.isArray(type)?select('f-'+id,label,type,filters[id]||'',true):input('f-'+id,label,type,filters[id]||'')).join('')}</div><p class="muted">Keyword searches Request ID, Agency ID, Agency Name and License Number. All filters combine with AND.</p><div class="actions"><button class="btn primary">Apply</button><button class="btn" type="button" data-action="resetFilters">Reset</button></div><p class="error" id="filterError" role="alert"></p></form><div class="chips">${kpi?`<button class="chip" data-kpi="">Clear KPI ×</button>`:''}${Object.entries(filters).filter(([,v])=>v!=='').map(([key,value])=>`<button class="chip" data-clear="${key}" aria-label="Clear ${filterDefs.find(d=>d[0]===key)[1]}">${filterDefs.find(d=>d[0]===key)[1]}: ${esc(value)} ×</button>`).join('')}</div></section><section class="card"><div class="section-head"><span>${rows.length} requests · ${selected.size} selected</span>${button('Bulk Assign','bulkAssign','Assign Review',!selected.size)}</div>${table(['<input type="checkbox" id="selectAll" aria-label="Select all visible requests" '+(!rows.length?'disabled':'')+'>','Request ID','Agency','License Number','Submitted Date','OCR Status','Match Result','Critical Confidence','External Check','Verification Status','Verification Method','Code Status','Assigned To', function renderDetail(){const r=records.find(x=>x.id===currentId);if(!r)return '';const closed=terminal(r);return `<div class="section-head"><button class="btn" data-action="back">← Back to Verification Queue</button>${badge(r.status)}</div><div class="step-flow"><span>Document review</span><span>Contact/address verification</span><span>Code confirmation</span><span>Final approval</span></div><section class="card"><h2>A. Request Summary</h2><div class="grid">${[['Request ID',r.id],['Agency ID',r.agencyId],['Agency Name',r.agency],['Submission Date',r.submitted],['Current Status',r.status],['Assigned Admin',r.admin],['Assigned Admin Team',r.team],['Review Deadline',r.deadline],['Previous Submission Count',r.previous],['Fraud Warning',r.fraud],['Duplicate Registration Warning',r.duplicate]].map(([k,v])=>kv(k,v)).join('')}</div><div class="actions">${button('Assign Admin / Team','assign','Assign Review')}${button('Add Internal Note','note','Perform Manual Check',closed)}</div>${r.notes.length?`<details><summary>Internal notes (${r.notes.length})</summary>${r.notes.map(n=>`<p>${esc(n)}</p>`).join('')}</details>`:''}${r.returnReason?`<div class="notice">Returned: ${esc(r.returnReason)} · ${esc(r.corrections||'License document')}<br>${esc(r.instructions||'')}</div>`:''}${r.denialReason?`<div class="notice">Denied: ${esc(r.denialReason)}</div>`:''}</section><section class="card"><h2>B. Uploaded Documents</h2><p class="muted">Restricted document access · originals are sensitive. View and download actions are audited. Preview/download content is synthetic.</p>${table(['Document','File Type','File Size','Uploaded Date','Virus Scan Result','Retention / Delete Date','Actions'],documentRows(r))}</section><section class="card"><div class="section-head"><h2>C. OCR Extraction</h2><div class="actions">${badge(r.ocrStatus)}${button('Retry OCR','ocrRetry','View OCR Result',closed||r.ocrBusy)}</div></div>${!can('View OCR Result')?'<p class="empty">OCR results restricted for this permission profile.</p>':r.ocrStatus!=='Completed'?'<div class="notice loading" role="status">OCR processing — extraction is not yet available. Retry OCR to simulate completion.</div>':table(['Field','Extracted Value','Confidence Score','Priority','OCR Result','Warning'],['Licensing Authority','License Number','Renewal Count','Company Name','Representative Name','Address','License Issue Date','Expiration Date'].map(f=>`<tr><td>${f}</td><td class="wrap">${esc(r.ocr[f])}</td><td>${r.confidence[f]}%</td><td>${policy.priorities[f]||'Medium'}</td><td>${badge(r.confidence[f]<policy.thresholds[f]?'Low Confidence':'Extracted')}</td><td>${r.confidence[f]<policy.thresholds[f]?'<span class="error">Below field threshold '+policy.thresholds[f]+'%</span>':'—'}</td></tr>`).join(''))}<small>No OCR raw result is included in ordinary activity messages.</small></section><section class="card"><h2>D. Three Source Comparison</h2><p class="muted">Registered information compared with OCR, Corporate Number API and external search. Normalized Match is not a mismatch. Corporate API does not supply license fields.</p>${!can('View OCR Result')?'<p>Comparison restricted: View OCR Result permission required.</p>':table(['Field','Registered Information','OCR Result','Corporate Number API','External Search Site','Confidence','Priority','Result'],fields.map(f=>`<tr><td>${f}</td><td class="wrap">${esc(r.registered[f])}</td><td class="wrap">${r.ocrStatus==='Completed'?esc(r.ocr[f]):'Not Available'}</td><td class="wrap">${esc(r.corporate[f]||'Not Available')}</td><td class="wrap">${['Matched','Manually Confirmed'].includes(r.external)?esc(r.externalData[f]):badge(errorStatuses.includes(r.external)?'External Check Error':'Not Available')}</td><td>${r.confidence[f]}%</td><td>${policy.priorities[f]}</td><td>${badge(compare(r,f))}</td></tr>`).join(''))}<p>Critical confidence: ${critical(r)}% · Minimum: ${policy.critical}%</p></section><details class="card"><summary>E. Normalization Details</summary>${can('View OCR Result')?table(['Normalization','Original Value','Normalized Value'],normalizations(r).map(row=>'<tr>'+row.map(v=>`<td class="wrap">${esc(v)}</td>`).join('')+'</tr>').join('')):'Restricted: View OCR Result permission required.'}<small>Illustrative transformations; production requires a validated Japanese normalization service.</small></details><div class="two-col"><section class="card"><h2>F. Corporate Number API</h2>${kv('Corporate Number','100000000000'+records.indexOf(r))}${kv('Corporate Name',r.corporate['Company Name'])}${kv('Head Office Address',r.corporate.Address)}${kv('Change History','Registered office confirmed; no subsequent changes in mock response.')}${kv('API Response Status','Success (mock)')}${kv('Last Checked At',stamp(r.checkedAt))}<div class="notice">Corporate Number API confirms corporate identity but does not confirm real estate license validity.</div></section><section class="card"><h2>G. External Search Site Check</h2>${badge(r.external)}${kv('Checked By',r.checkedBy)}${kv('Checked At',stamp(r.checkedAt))}${kv('Admin Note',r.externalNote||'—')}<p class="muted">Connection Failure, Parsing Failure and Timeout remain errors, not “No Matching Information Found”.</p><div class="actions"><a class="btn" href="https://etsuran2.mlit.go.jp/TAKKEN/" target="_blank" rel="noopener noreferrer">Open Official Search Site</a>${button('Retry Check','externalRetry','Perform Manual Check',closed||r.externalBusy)}${button('Mark as Manually Checked','manualCheck','Perform Manual Check',closed)}</div><details><summary>Mock external response</summary>${select('externalOutcome','Next retry result',externalStatuses.filter(s=>!['Manually Confirmed','Not Checked'].includes(s)),r.external)}</details></section></div><section class="card"><h2>H. Document Review Decision</h2><p>Document Review Status: ${badge(r.documentReviewStatus)}</p><div class="notice">Document Review Passed does not mean Approved. Contact or address verification is required next. ${manualRequired(r)?'Manual review required: resolve external errors and document your review findings.':''}</div><div class="actions">${button('Mark Document Review as Passed','pass','Pass Document Review',closed||r.documentReviewStatus==='Passed'||r.ocrStatus!=='Completed'||!['Matched','Manually Confirmed'].includes(r.external),'primary')}${button('Return for Correction','return','Return Application',closed,'danger')}${button('Deny','deny','Deny Application',closed,'danger')}</div><p class="muted">Representative Name or Address mismatch alone must not be used as the sole reason for Deny. External errors never cause automatic denial.</p></section>${r.documentReviewStatus==='Passed'?renderCode(r):'<section class="card"><h2>Contact and Address Verification</h2><p>Available after Document Review Status = Passed.</p></section>'}<section class="card"><h2>Final Approval</h2><div class="actions"><span title="${gateNote}">${button('Approve Agency','approve','Approve Agency',!canApprove(r),'primary')}</span>${badge(r.status)}</div><p class="muted">${gateNote}</p>${r.verifiedAt?`<div class="grid">${kv('Verified Date',stamp(r.verifiedAt))}${kv('Verified By',r.verifiedBy)}</div><div class="notice">Agency approval notification sent (mock).</div>`:''}</section>${permissionInfo()}`}
function renderCode(r){const c=r.code,closed=terminal(r),live=['Generated','Sent','Awaiting Entry'].includes(c.status);return `<section class="card"><h2>Contact and Address Verification</h2><div class="notice">${r.status==='Document Review Passed'?'Contact or Address Verification Required. ':''}The Agency must confirm the code before final approval.</div><div class="grid">${select('verifyMethod','Verification Method',methodOptions,r.method)}${kv('Destination',destination(r))}</div><p class="muted">IP phone and mobile phone are not eligible under the current rule.</p><p class="muted">Postal Mail: Official address from the license or official registry. A different website-entered address is never used.</p>${!eligibleDestination(r)?'<p class="error">This phone is not eligible. Choose Registered Email or Postal Mail.</p>':''}<div class="grid">${[['Code Status',c.status],['Code Generated At',stamp(c.generatedAt)],['Code Expiration',stamp(c.expiresAt)],['Sent At',stamp(c.sentAt)],['Delivery Status',c.delivery],['Failed Attempt Count',c.attempts],['Maximum Attempts',c.maxAttempts]].map(([k,v])=>kv(k,v)).join('')}</div><div class="actions">${button('Generate Verification Code','generate','Generate Verification Code',closed||c.status!=='Not Generated'||!eligibleDestination(r))}${button('Mark as Sent','send','Generate Verification Code',closed||c.status!=='Generated')}${button('Resend/Reissue Code','reissue','Generate Verification Code',closed||c.status==='Not Generated')}${button('Revoke Code','revoke','Generate Verification Code',closed||['Not Generated','Revoked'].includes(c.status),'danger')}${button('Simulate Agency Code Confirmation','confirmCode','Generate Verification Code',closed||!['Sent','Awaiting Entry'].includes(c.status),'primary')}</div><details><summary>Mock code failure controls</summary><div class="actions">${button('Simulate Wrong Code','wrongCode','Generate Verification Code',closed||!['Sent','Awaiting Entry'].includes(c.status))}${button('Simulate Code Expiry','expireCode','Generate Verification Code',closed||!live)}</div></details><details><summary>Resend/Reissue History (${c.history.length})</summary>${c.history.map(h=>`<p>${stamp(h.at)} · ${esc(h.action)} · ${esc(h.method)}</p>`).join('')||'<p>No code history.</p>'}</details><small>No actual verification code or email is generated by this frontend mock. Reissue revokes the previous code; cooldown is ${policy.cooldown} seconds.</small></section>`}
function renderRules(){const p=rulesDraft||policy;return `<section class="card"><h2>Rules &amp; Thresholds</h2><form id="rulesForm"><fieldset ${!can('Manage Verification Settings')?'disabled':''} style="border:0;padding:0;margin:0">${table(['Field','OCR Threshold (%)','Field Priority'],[...fields,'License Issue Date'].map((f,i)=>`<tr><td>${f}</td><td><input aria-label="${f} OCR threshold" type="number" min="0" max="100" required name="threshold-${i}" value="${p.thresholds[f]}"></td><td>${fields.includes(f)?`<select aria-label="${f} priority" name="priority-${i}">${options(['High','Medium','Low'],p.priorities[f])}</select>`:'Medium'}</td></tr>`).join(''))}<div class="grid" style="margin-top:16px">${[['critical','Critical field confidence threshold (%)',p.critical],['expiration','Code Expiration (hours)',p.expiration],['attempts','Maximum Code Attempts',p.attempts],['cooldown','Code Resend Cooldown (seconds)',p.cooldown],['retention','Document Retention Period (days)',p.retention],['maxSize','Maximum File Size (MB)',p.maxSize]].map(([key,label,value])=>`<label>${label}<input required name="${key}" type="number" min="${['critical','cooldown'].includes(key)?0:1}" ${key==='critical'?'max="100"':''} value="${value}"></label>`).join('')}<label>Normalized Match handling<select name="normalized">${options(['Accept as normalized match','Manual review'],p.normalized)}</select></label></div><label class="check-label"><input type="checkbox" name="exact" ${p.exact?'checked':''}> Require exact critical-field evidence; allow accepted normalization. Missing critical evidence requires manual review.</label><h3>Allowed File Formats</h3><div class="actions">${['PDF','JPG','PNG','WEBP'].map(f=>`<label class="check-label"><input type="checkbox" name="formats" value="${f}" ${p.formats.includes(f)?'checked':''}>${f}</label>`).join('')}</div><p class="muted">Upload limits apply to future submissions; existing evidence is not silently removed. Retention changes apply to future submissions. Generated codes retain their original expiry and maximum-attempt snapshot.</p><label class="check-label"><input type="checkbox" disabled> Auto Approval Toggle — OFF ${badge('Future Phase')}</label><div class="notice">Even when future automatic document review is enabled, final Agency approval still requires verification code confirmation unless the business rule is changed.</div><p id="rulesError" class="error" role="alert"></p><div class="actions"><button class="btn primary">Save Settings</button><button class="btn" type="button" data-action="discardRules">Discard Changes</button><span id="rulesState" class="muted">${rulesDirty?'Unsaved changes':'Saved settings'}</span></div></fieldset></form></section>${permissionInfo()}`}
function auditRows(){return logs.filter(l=>(!auditFilters.request||l.requestId===auditFilters.request)&&(!auditFilters.action||l.action===auditFilters.action)&&(!auditFilters.admin||l.admin===auditFilters.admin)&&(!auditFilters.from||l.timestamp.slice(0,10)>=auditFilters.from)&&(!auditFilters.to||l.timestamp.slice(0,10)<=auditFilters.to)&&(!auditFilters.document||l.document===auditFilters.document))}
const logTable=rows=>table(['Timestamp','Admin','Admin Team','Action','Request ID','Agency','Previous Status','New Status','Document','IP/Device','Note'],rows.map(l=>`<tr>${[stamp(l.timestamp),l.admin,l.team,l.action,l.requestId,l.agency,l.previous,l.next,l.document||'—',l.device].map(v=>`<td>${esc(v)}</td>`).join('')}<td class="audit-note">${esc(l.note)}</td></tr>`).join(''));
function renderAudit(){if(!can('View Audit Log'))return '<div class="card empty">Permission required: View Audit Log</div>';return `<section class="card"><div class="section-head"><h2>Audit Log</h2>${button('Export CSV','exportAudit','Export Audit Log')}</div><form id="auditForm"><div class="filters">${select('audit-request','Request ID',records.map(r=>r.id),auditFilters.request,true)}${select('audit-action','Action',[...new Set(logs.map(l=>l.action))],auditFilters.action,true)}${select('audit-admin','Admin',admins,auditFilters.admin,true)}${input('audit-from','Date From','date',auditFilters.from)}${input('audit-to','Date To','date',auditFilters.to)}</div><div class="actions" style="margin:12px 0"><button class="btn primary">Apply</button><button class="btn" type="button" data-action="resetAudit">Reset</button></div><p id="auditError" class="error"></p></form>${auditFilters.document?`<p>Document access: ${esc(auditFilters.document)} <button class="chip" data-action="resetAudit">Clear ×</button></p>`:''}<p class="muted">${auditRows().length} entries · OCR raw values and codes are excluded from standard activity notes.</p>${logTable(auditRows())}</section>`}
function render(){document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-current',b.dataset.view===view?'page':'false')});$('app').innerHTML=currentId&&view==='queue'?renderDetail():view==='rules'?renderRules():view==='audit'?renderAudit():renderQueue();wireForms();if($('verifyMethod'))$('verifyMethod').disabled=terminal(current())||!can('Generate Verification Code');}
function current(){return records.find(r=>r.id===currentId)}
function collectRules(){const f=new FormData($('rulesForm')),p=clone(policy);[...fields,'License Issue Date'].forEach((field,i)=>{p.thresholds[field]=Number(f.get('threshold-'+i));if(fields.includes(field))p.priorities[field]=f.get('priority-'+i)});for(const k of ['critical','expiration','attempts','cooldown','retention','maxSize'])p[k]=Number(f.get(k));p.normalized=f.get('normalized');p.exact=f.has('exact');p.formats=f.getAll('formats');return p}
function wireForms(){if($('filters'))$('filters').onsubmit=e=>{e.preventDefault();const next=Object.fromEntries(filterDefs.map(([key])=>[key,$('f-'+key).value.trim()]));let error='';for(const [a,b] of [['from','to'],['expiryFrom','expiryTo']])if(next[a]&&next[b]&&next[a]>next[b])error='From date must be on or before To date.';if(['min','max'].some(k=>next[k]!==''&&(!Number.isFinite(Number(next[k]))||Number(next[k])<0||Number(next[k])>100))||(next.min!==''&&next.max!==''&&Number(next.min)>Number(next.max)))error='Confidence must be between 0 and 100, with Min ≤ Max.';if(error){$('filterError').textContent=error;return}filters=next;selected.clear();render()};if($('auditForm'))$('auditForm').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(['request','action','admin','from','to'].map(k=>[k,$('audit-'+k).value]));if(f.from&&f.to&&f.from>f.to){$('auditError').textContent='From date must be on or before To date.';return}auditFilters=f;render()};if($('rulesForm')){$('rulesForm').oninput=()=>{rulesDraft=collectRules();rulesDirty=true;$('rulesState').textContent='Unsaved changes'};$('rulesForm').onsubmit=e=>{e.preventDefault();if(!guard('Manage Verification Settings'))return;const p=collectRules();const valid=p.formats.length&&Object.values(p.thresholds).every(n=>Number.isFinite(n)&&n>=0&&n<=100)&&Number.isFinite(p.critical)&&p.critical>=0&&p.critical<=100&&['expiration','attempts','retention','maxSize'].every(k=>Number.isInteger(p[k])&&p[k]>0)&&Number.isInteger(p.cooldown)&&p.cooldown>=0&&Object.values(p.priorities).includes('High');if(!valid){$('rulesError').textContent='Use valid thresholds (0–100), positive whole limits, nonnegative cooldown, at least one file format and at least one High priority field.';return}policy=p;rulesDraft=clone(p);rulesDirty=false;log('Settings Changed',null,'Saved policy','Verification policy updated; final approval code gate unchanged.');records.filter(r=>!terminal(r)&&r.documentReviewStatus!=='Passed').forEach(r=>{if(manualRequired(r)&&r.ocrStatus==='Completed')r.status='Manual Review Required'});toast('Settings saved. Existing generated codes and document deletion dates retain their snapshots.');render()}}}
function changeView(next,after){const go=()=>{rulesDirty=false;rulesDraft=null;view=next;currentId=null;selected.clear();if(after)after();render()};if(rulesDirty)modal('Unsaved Changes','<p>Discard unsaved verification settings and leave this view?</p>',()=>go(),'Discard and continue');else go()}
function assign(ids){if(!guard('Assign Review'))return;modal('Assign Review',`<p>${ids.length} request(s) selected.</p><label>Assignment target<select name="target"><option>Individual</option><option>Team</option></select></label><label>Yuushi Admin individual<select name="admin">${options(admins,actor.name)}</select></label><label>Yuushi Admin team<select name="team">${options(teams,actor.team)}</select></label><small>Individual assignment changes the assigned admin; team assignment changes the assigned team. The other field is preserved.</small>`,f=>{if(!can('Assign Review'))return 'Assign Review permission required.';for(const id of ids){const r=records.find(r=>r.id===id);if(!r)continue;const prev=r.status;if(f.get('target')==='Individual')r.admin=f.get('admin');else r.team=f.get('team');r.updated=now();log('Assign',r,prev,'Assigned '+f.get('target').toLowerCase()+' updated.')}selected.clear();toast('Assignment changed.');render()},'Assign')}
function changeStatus(r,status,action,note){const previous=r.status;r.status=status;r.updated=now();log(action,r,previous,note)}
function invalidateCode(r,reason){if(r.code.status!=='Not Generated'&&r.code.status!=='Revoked'){const previous=r.status;r.code.status='Revoked';r.code.delivery='Revoked';r.code.history.push({at:now(),action:'Revoked',method:r.method});if(r.documentReviewStatus==='Passed'&&!terminal(r))r.status='Contact or Address Verification Required';r.updated=now();log('Revoke Code',r,previous,reason)}}
function decision(action){const r=current(),p={pass:'Pass Document Review',return:'Return Application',deny:'Deny Application',approve:'Approve Agency'}[action];if(!r||!guard(p,r))return;
 if(action==='pass'){if(r.documentReviewStatus==='Passed'||r.ocrStatus!=='Completed'||!['Matched','Manually Confirmed'].includes(r.external))return toast('Complete OCR and resolve or manually check external results before passing document review.');const needsManual=manualRequired(r);modal('Mark Document Review as Passed',`<p>This only passes document review. Contact/address verification remains mandatory.</p>${needsManual?'<p class="notice">Manual Review Required. Record independent review findings before continuing.</p>':''}<label>Internal review note<textarea name="note" ${needsManual?'required':''}></textarea></label>`,f=>{if(!guard(p,r)||r.ocrStatus!=='Completed'||!['Matched','Manually Confirmed'].includes(r.external))return 'Review state changed; check the request again.';if(needsManual&&!String(f.get('note')).trim())return 'Internal review findings are required.';r.documentReviewStatus='Passed';if(f.get('note'))r.notes.push(String(f.get('note')).trim());changeStatus(r,'Document Review Passed','Document Review Passed','Contact or address verification is required next.');toast('Document review passed. Contact or Address Verification Required.');render()},'Pass document review');}
 if(action==='return')modal('Return for Correction',`<label>Return Reason<textarea name="reason" required></textarea></label><label>Field or document to correct<select name="correction" required><option value="">Select field or document</option>${options([...fields,...r.documents.map(d=>d.type)],'')}</select></label><label>Additional Instruction<textarea name="instructions"></textarea></label><label class="check-label"><input type="checkbox" name="confirmed" required>Confirm returning the application and notifying the Agency.</label>`,f=>{if(!can(p)||terminal(r))return 'Action is no longer available.';if(!String(f.get('reason')).trim()||!f.get('correction')||!f.has('confirmed'))return 'Reason, correction selection and confirmation are required.';invalidateCode(r,'Application returned.');r.documentReviewStatus='Returned';r.returnReason=f.get('reason').trim();r.corrections=f.get('correction');r.instructions=f.get('instructions').trim();changeStatus(r,'Returned for Correction','Return','Correction requested; mock Agency notification sent.');toast('Documents returned. Agency notification sent (mock).');render()},'Confirm return');
 if(action==='deny')modal('Deny Application',`<div class="notice error">This is a final decision. Do not deny solely because of an external service error, Address mismatch or Representative Name mismatch.</div><label>Denial Reason<textarea name="reason" required></textarea></label><label>Internal Note<textarea name="note" required></textarea></label><label class="check-label"><input type="checkbox" name="evidence" required>I confirmed independent evidence; the reason is not solely an external error, Address or Representative Name mismatch.</label>`,f=>{if(!can(p)||terminal(r))return 'Action is no longer available.';if(!String(f.get('reason')).trim()||!String(f.get('note')).trim()||!f.has('evidence'))return 'Denial reason, internal note and evidence confirmation are required.';invalidateCode(r,'Application denied.');r.documentReviewStatus='Denied';r.denialReason=f.get('reason').trim();r.notes.push(f.get('note').trim());changeStatus(r,'Denied','Deny','Manual denial decision recorded; mock Agency notification sent.');toast('Application denied. Agency notification sent (mock).');render()},'Confirm denial');
 if(action==='approve'){expireCodes();if(!canApprove(r))return toast(gateNote);modal('Final Approval',`<p>Approve ${esc(r.agency)} (${r.agencyId})?</p><p>Document review: Passed · Verification code: Confirmed</p><p>The Agency will be notified. This mock does not modify Agency Management.</p>`,()=>{expireCodes();if(!canApprove(r))return gateNote;r.verifiedAt=now();r.verifiedBy=actor.name;changeStatus(r,'Approved','Approve','Final approval; mock Agency notification sent.');toast('Agency approved. Agency notification sent (mock).');render()},'Approve Agency')}
}
function expireCodes(){let changed=false;records.forEach(r=>{if(!terminal(r)&&['Generated','Sent','Awaiting Entry'].includes(r.code.status)&&Date.parse(r.code.expiresAt)<=Date.now()){r.code.status='Expired';r.code.delivery='Expired';changeStatus(r,'Awaiting Verification Code','Code Expired','Code expired; reissue is required.');toast('Verification code expired for '+r.id+'.');changed=true}});return changed}
function codeAction(action){const r=current();if(!r||!guard('Generate Verification Code',r)||r.documentReviewStatus!=='Passed')return false;expireCodes();const c=r.code,previous=r.status;
 if(['generate','reissue'].includes(action)){if(!eligibleDestination(r))return toast('IP phone and mobile phone are not eligible.');if(action==='generate'&&c.status!=='Not Generated')return;if(action==='reissue'&&(c.status==='Not Generated'||Date.now()-Date.parse(c.generatedAt)<policy.cooldown*1000))return toast('Resend cooldown has not elapsed. Wait '+policy.cooldown+' seconds after code generation.');if(action==='reissue')invalidateCode(r,'Reissue invalidated the prior code.');c.status='Generated';c.generatedAt=now();c.expiresAt=new Date(Date.now()+policy.expiration*3600000).toISOString();c.sentAt=null;c.confirmedAt=null;c.attempts=0;c.maxAttempts=policy.attempts;c.delivery='Ready to send';c.history.push({at:now(),action:action==='generate'?'Generated':'Reissued',method:r.method});changeStatus(r,'Contact or Address Verification Required',action==='generate'?'Generate Code':'Reissue Code','Code prepared for '+r.method+'.');toast('Verification code generated (mock). Mark as Sent after dispatch.');}
 if(action==='send'){if(c.status!=='Generated'||!eligibleDestination(r))return;c.status='Sent';c.sentAt=now();c.delivery='Sent (mock)';changeStatus(r,'Verification Code Sent','Send Code','Dispatch marked for '+r.method+'.');c.history.push({at:now(),action:'Sent',method:r.method});c.status='Awaiting Entry';changeStatus(r,'Awaiting Verification Code','Await Code Entry','Agency code entry is required.');toast('Verification code sent (mock). Awaiting Agency entry.');}
 if(action==='revoke'){if(['Not Generated','Revoked'].includes(c.status))return;invalidateCode(r,'Code revoked by admin.');r.status='Contact or Address Verification Required';r.updated=now();toast('Verification code revoked.');}
 if(action==='confirmCode'){if(!['Sent','Awaiting Entry'].includes(c.status)||c.attempts>=c.maxAttempts||Date.parse(c.expiresAt)<=Date.now())return toast('Code cannot be confirmed. Send a valid unexpired code first.');c.status='Confirmed';c.confirmedAt=now();changeStatus(r,'Verification Code Confirmed','Code Confirmed','Agency code confirmation simulated; final approval now available.');toast('Code confirmed. Final approval is now available.');}
 if(action==='wrongCode'){if(!['Sent','Awaiting Entry'].includes(c.status))return;c.attempts++;if(c.attempts>=c.maxAttempts){c.status='Maximum Attempts Reached';changeStatus(r,'Awaiting Verification Code','Maximum Attempts Reached','Code entry locked. Reissue is required.');toast('Maximum attempts reached. Reissue a code.')}else{log('Code Attempt Failed',r,previous,'Mock failed attempt '+c.attempts+'.');toast('Incorrect code. '+(c.maxAttempts-c.attempts)+' attempts remaining.')}}
 if(action==='expireCode'){if(!['Generated','Sent','Awaiting Entry'].includes(c.status))return;c.expiresAt=new Date(Date.now()-1000).toISOString();expireCodes()}
 render();return true;
}
function download(name,content,type='text/plain'){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function docAction(id,action){const r=current(),d=r?.documents.find(d=>d.id===id);if(!d)return;const p={view:'View Original Document',download:'Download Original Document',audit:'View Audit Log'}[action];if(!guard(p,r,true))return;if(action==='audit'){auditFilters={request:r.id,document:d.name};changeView('audit');return}if(d.scan!=='Clean')return toast('Access blocked: virus scan is not clean.');if(d.deleteAt<today)return toast('Document retention has expired. Original access is restricted.');if(action==='view'){log('View Original',r,r.status,'Sensitive original viewed (synthetic preview).',d.name);modal('Sensitive Document',`<div class="notice">Sensitive Document · Restricted document access · Virus scan: ${d.scan}</div><div class="paper"><h3>${d.type}</h3><p>${esc(d.name)}</p><p>${esc(r.agency)}</p><p>MOCK DOCUMENT PREVIEW</p><p>No production document image or OCR debug image is included.</p></div><small>Access logged. Delete date: ${d.deleteAt}.</small>`,null)}else{log('Download',r,r.status,'Sensitive original download requested (synthetic placeholder).',d.name);download(d.name+'.mock.txt','Sensitive Document\nSynthetic placeholder only; not the original file.\n'+d.type+'\n'+r.id);toast('Mock document placeholder downloaded; access logged.')}}
function exportAudit(){if(!guard('Export Audit Log')||!can('View Audit Log'))return;const columns=['timestamp','admin','team','action','requestId','agency','previous','next','document','device','note'];const cell=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';download('agency-license-audit.csv','\uFEFF'+[columns.map(cell).join(','),...auditRows().map(r=>columns.map(k=>cell(r[k])).join(','))].join('\r\n'),'text/csv');toast('Audit CSV exported.');}
function handleAction(action){const r=current();if(['pass','return','deny','approve'].includes(action))return decision(action);if(['generate','send','reissue','revoke','confirmCode','wrongCode','expireCode'].includes(action))return codeAction(action);
 switch(action){case'back':currentId=null;render();break;case'resetFilters':filters={};kpi='';selected.clear();render();break;case'resetAudit':auditFilters={};render();break;case'exportAudit':exportAudit();break;case'bulkAssign':if(selected.size)assign([...selected]);break;case'assign':assign([r.id]);break;case'discardRules':modal('Discard Changes','<p>Discard unsaved policy changes?</p>',()=>{rulesDraft=clone(policy);rulesDirty=false;render()},'Discard');break;
 case'note':if(!guard('Perform Manual Check',r))return;modal('Add Internal Note','<label>Internal Note<textarea required name="note"></textarea></label>',f=>{if(!can('Perform Manual Check'))return 'Permission required.';if(!String(f.get('note')).trim())return 'Enter a note.';r.notes.push(f.get('note').trim());log('Internal Note',r,r.status,'Internal note added; content available in request detail.');render();toast('Internal note added.')},'Save note');break;
 case'ocrRetry':if(!guard('View OCR Result',r)||r.ocrBusy)return;if(r.documentReviewStatus==='Passed'){invalidateCode(r,'OCR evidence is being reprocessed.');r.documentReviewStatus='Pending';r.status='Pending Review'}r.ocrBusy=true;r.ocrStatus='Processing';log('OCR Retry',r,r.status,'OCR retry requested; no raw result logged.');render();setTimeout(()=>{r.ocrBusy=false;r.ocrStatus='Completed';const previous=r.status;if(!terminal(r)){r.status=manualRequired(r)?'Manual Review Required':'Pending Review';r.updated=now()}log('OCR Completed',r,previous,'Extraction completed; result restricted to detail view.');toast('OCR processing completed.'+(manualRequired(r)?' Manual review required.':''));render()},700);break;
 case'externalRetry':if(!guard('Perform Manual Check',r)||r.externalBusy)return;const outcome=$('externalOutcome')?.value||'Matched';r.externalBusy=true;log('External Check Retry',r,r.status,'External check requested.');toast('Checking external service…');render();setTimeout(()=>{r.externalBusy=false;if(terminal(r)){render();return}r.external=outcome;r.checkedBy=actor.name;r.checkedAt=now();if(r.documentReviewStatus==='Passed'){invalidateCode(r,'External evidence changed after document review.');r.documentReviewStatus='Pending'}changeStatus(r,manualRequired(r)?'Manual Review Required':'Pending Review','External Check Result',errorStatuses.includes(outcome)?'External service failure; manual review required.':'External result updated.');toast(errorStatuses.includes(outcome)?'External service failure. Manual review required.':'External check completed.'+(manualRequired(r)?' Manual review required.':''));render()},700);break;
 case'manualCheck':if(!guard('Perform Manual Check',r))return;modal('Manual External Check','<label>Admin Note<textarea name="note" required placeholder="Record the official source and manual findings."></textarea></label><label class="check-label"><input type="checkbox" name="checked" required>I checked the official source.</label>',f=>{if(!can('Perform Manual Check')||terminal(r))return 'Action unavailable.';if(!String(f.get('note')).trim()||!f.has('checked'))return 'Admin note and confirmation required.';r.external='Manually Confirmed';r.checkedBy=actor.name;r.checkedAt=now();r.externalNote=f.get('note').trim();log('Manual Check',r,r.status,'Official source manually checked; findings retained in request detail.');toast('Manual check recorded. Document review is still required.');render()},'Mark as Manually Checked');break;
 }
}
document.addEventListener('click',e=>{const b=e.target.closest('button,a');if(!b||b.disabled)return;if(b.hasAttribute('data-close')){$('dialog').close();return}if(b.dataset.view){changeView(b.dataset.view);return}if(b.dataset.review){if(!can('View Verification Queue'))return;currentId=b.dataset.review;render();window.scrollTo(0,0);return}if(b.dataset.assign){assign([b.dataset.assign]);return}if(b.dataset.audit){if(!can('View Audit Log'))return;changeView('audit',()=>auditFilters={request:b.dataset.audit});return}if(b.dataset.kpi!==undefined){kpi=b.dataset.kpi;selected.clear();render();return}if(b.dataset.clear){delete filters[b.dataset.clear];selected.clear();render();return}if(b.dataset.doc){docAction(b.dataset.doc,b.dataset.docAction);return}if(b.dataset.action)handleAction(b.dataset.action)});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.select){if(t.checked)selected.add(t.dataset.select);else selected.delete(t.dataset.select);render();return}if(t.id==='selectAll'){filtered().forEach(r=>t.checked?selected.add(r.id):selected.delete(r.id));render();return}if(t.id==='verifyMethod'){const r=current(),newMethod=t.value;if(!can('Generate Verification Code')||terminal(r)){render();return}if(newMethod===r.method)return;modal('Change Verification Method','<p>Changing the method revokes any existing code and removes its confirmation. Generate and send a new code for the new destination.</p>',()=>{if(!can('Generate Verification Code')||terminal(r))return 'Action unavailable.';invalidateCode(r,'Verification destination changed.');r.method=newMethod;r.code.status='Not Generated';r.code.generatedAt=null;r.code.expiresAt=null;r.code.sentAt=null;r.code.confirmedAt=null;r.code.delivery='Not sent';r.code.attempts=0;changeStatus(r,'Contact or Address Verification Required','Verification Method Changed','New destination requires verification.');render()},'Change method');render();return}});
$('permissionProfile').onchange=e=>{const next=e.target.value;const apply=()=>{profile=next;rulesDirty=false;rulesDraft=null;render()};if(rulesDirty){e.target.value=profile;modal('Unsaved Changes','<p>Discard unsaved settings before changing the mock permission profile?</p>',()=>{apply();$('permissionProfile').value=next},'Discard and continue')}else apply()};
$('dialog').addEventListener('cancel',()=>{});
window.addEventListener('beforeunload',e=>{if(rulesDirty){e.preventDefault();e.returnValue=''}});
setInterval(()=>{if(expireCodes())render()},1000);
render();
return {records,logs,canApprove,can,compare,match,critical,filtered,codeAction,handleAction,decision,expireCodes,normalize,get policy(){return policy},get view(){return view},get currentId(){return currentId}};
})();
</script>
